<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#8fd3ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nederlands">
<title>Nederlands leren</title>
<style>
  :root{
    --bg:#c3e6ff; --panel:#ffffff; --panel2:#eef4fb;
    --border:#d7e2ee; --border-soft:#e6edf5;
    --text:#20303d; --text-dim:#5e7284;
    --en:#1382c6; --nl:#b9781f;
    --good:#3fa826; --bad:#e5484d;
    --good-bg:rgba(63,168,38,0.13); --bad-bg:rgba(229,72,77,0.12);
    --accent:#7c5cff;
    --card-shadow:0 6px 18px rgba(40,70,110,.12);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5; -webkit-text-size-adjust:100%; -webkit-tap-highlight-color:transparent;
    padding-bottom:60px;
  }
  #app{max-width:960px; margin:0 auto;}
  button{font-family:inherit;}
  .dim{color:var(--text-dim); font-size:14px;}

  /* ---------- gate ---------- */
  .gate{ padding:40px 20px; text-align:center; max-width:460px; margin:0 auto; }
  .gate-logo{ font-size:44px; }
  .gate h1{ font-size:24px; margin:6px 0 4px; }
  .profile-list{ display:flex; flex-direction:column; gap:10px; margin:22px 0 16px; }
  .profile-btn{
    display:flex; flex-direction:column; align-items:flex-start; gap:2px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:14px 16px; color:var(--text); cursor:pointer; width:100%;
  }
  .profile-btn:hover{ border-color:var(--accent); }
  .profile-btn .pname{ font-size:16px; font-weight:700; }
  .profile-btn .psub{ font-size:12px; color:var(--text-dim); }
  .addrow{ display:flex; gap:8px; }
  .addrow input{ flex:1; min-width:0; }
  input[type=text],input:not([type]){
    background:var(--panel2); border:1px solid var(--border); border-radius:10px;
    padding:11px 12px; color:var(--text); font-size:16px;
  }
  .btn-accent{
    background:var(--accent); color:#160e2e; border:none; border-radius:10px;
    padding:11px 14px; font-size:14px; font-weight:700; cursor:pointer; white-space:nowrap;
  }
  .iorow{ margin-top:18px; }
  .linkbtn{
    background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer;
    text-decoration:underline; padding:6px;
  }
  .linkbtn:hover{ color:var(--accent); }

  /* ---------- topbar / hub ---------- */
  .topbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    justify-content:space-between; padding:10px 16px;
    background:rgba(255,255,255,0.86); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  .profchip{
    display:flex; align-items:center; gap:7px; background:var(--panel2);
    border:1px solid var(--border); border-radius:20px; padding:6px 12px;
    color:var(--text); font-size:13px; font-weight:600; cursor:pointer;
  }
  .profchip .chev{ color:var(--text-dim); }
  .toptotal{ font-size:13px; color:var(--text-dim); }
  .hubhead{ padding:18px 20px 4px; }
  .hubhead h1{ font-size:20px; margin:0; }
  .hub-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:12px; padding:16px 20px; }
  .mcard{
    display:flex; flex-direction:column; align-items:stretch; gap:6px; text-align:left;
    background:var(--panel); border:1px solid var(--border); border-radius:14px;
    padding:16px; color:var(--text); cursor:pointer;
  }
  .mcard:hover{ border-color:var(--accent); }
  .mtop{ display:flex; align-items:center; gap:9px; }
  .memoji{ font-size:20px; }
  .mtitle{ font-size:15.5px; font-weight:700; }
  .msub{ font-size:12.5px; color:var(--text-dim); min-height:17px; }
  .bar{ height:8px; border-radius:6px; background:var(--border); overflow:hidden; margin-top:6px; }
  .fill{ height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--good)); transition:width .25s; }
  .mmeta{ font-size:12px; color:var(--text-dim); margin-top:2px; }
  .hubfoot{ padding:10px 20px 30px; text-align:center; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

  /* ---------- module bar ---------- */
  .mbar{
    position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:10px;
    padding:10px 14px; background:rgba(255,255,255,0.9);
    -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); border-bottom:1px solid var(--border);
  }
  .backbtn{ background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; }
  .mbartitle{ flex:1; font-size:14px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mbarscore{ font-size:13px; color:var(--text-dim); }
  .resetbtn{ background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 11px; font-size:13px; cursor:pointer; }
  .resetbtn:hover{ border-color:var(--bad); color:var(--bad); }
  .mbody{ padding:18px 20px; }

  /* ---------- intro / rules ---------- */
  .introbox{ margin-bottom:20px; }
  .introtext{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:14px 16px; font-size:13.5px; color:var(--text-dim); margin-bottom:12px; }
  .introtext b{ color:var(--text); }
  .rulebox{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:13px 15px; margin-bottom:10px; }
  .rulebox h3{ margin:0 0 7px; font-size:14px; color:var(--accent); }
  .r-en{ border-left:3px solid var(--en); padding-left:11px; font-size:13px; margin-bottom:6px; }
  .r-nl{ border-left:3px solid var(--nl); padding-left:11px; font-size:12.5px; color:var(--text-dim); }
  .rulebox .note{ margin-top:8px; font-size:12.5px; color:var(--text-dim); background:var(--panel2); padding:8px 10px; border-radius:8px; }

  h2.section{ font-size:17px; margin:26px 0 12px; padding-bottom:7px; border-bottom:2px solid var(--border); display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .badge{ font-size:11px; font-weight:400; color:var(--text-dim); background:var(--panel2); padding:2px 9px; border-radius:20px; }

  /* ---------- de/het list ---------- */
  .list{ background:var(--panel); border:1px solid var(--border); border-radius:12px; overflow:hidden; }
  .rowitem{ display:grid; grid-template-columns:1fr 1fr auto; align-items:center; gap:10px; padding:10px 14px; border-bottom:1px solid var(--border-soft); }
  .rowitem:last-child{ border-bottom:none; }
  .w-en{ color:var(--en); font-weight:600; font-size:14px; }
  .w-nl{ color:var(--nl); font-weight:700; font-size:14px; }
  .btns{ display:flex; gap:6px; }
  .btns button{ background:var(--panel2); color:var(--text); border:2px solid var(--border); border-radius:8px; padding:6px 12px; font-size:13px; font-weight:700; cursor:pointer; min-width:50px; touch-action:manipulation; }
  .btns button:hover{ border-color:var(--accent); }
  .btns button.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .btns button.incorrect{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .btns button:disabled{ cursor:default; opacity:.65; }
  @media (max-width:520px){ .rowitem{ grid-template-columns:1fr 1fr; } .btns{ grid-column:1/-1; margin-top:2px; } }

  /* ---------- cards (conjug + separable) ---------- */
  .card{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:15px 16px; margin-bottom:13px; }
  .c-top{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; }
  .c-en{ color:var(--en); font-weight:600; font-size:14.5px; }
  .arr{ color:var(--text-dim); }
  .c-nl{ color:var(--nl); font-weight:700; font-size:15.5px; }
  .c-nl u{ text-decoration-color:var(--accent); text-decoration-thickness:2px; }
  .aux{ font-size:11px; color:var(--text-dim); border:1px solid var(--border-soft); padding:1px 7px; border-radius:10px; }
  .c-note{ font-size:12px; color:var(--accent); margin-top:8px; }
  .cgrid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:10px; margin-top:10px; }
  .field label{ display:block; font-size:11px; color:var(--text-dim); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
  select{ width:100%; padding:8px 9px; border-radius:8px; border:2px solid var(--border); background:var(--panel2); color:var(--text); font-size:16px; touch-action:manipulation; }
  select.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  select.incorrect{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  select.placeholder{ color:var(--text-dim); }
  select:disabled{ opacity:.85; }
  .cex{ margin-top:11px; font-size:13px; border-top:1px dashed var(--border-soft); padding-top:9px; }
  .exnl{ color:var(--nl); } .exen{ color:var(--en); font-style:italic; font-size:12px; display:block; margin-top:2px; }

  /* separable */
  .srow{ margin-top:11px; font-size:14px; line-height:2.2; }
  .srow .lbl{ display:block; font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; margin-bottom:2px; }
  select.inline{ display:inline-block; width:auto; min-width:66px; margin:0 3px; padding:5px 8px; font-size:15px; font-weight:700; }
  .subclause{ margin-top:10px; padding-top:9px; border-top:1px dashed var(--border-soft); font-size:13px; color:var(--text-dim); }
  .subclause .lbl2{ text-transform:uppercase; font-size:11px; }

  /* ---------- match game ---------- */
  .matchnav{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:12px; }
  .roundtitle{ font-size:16px; font-weight:700; }
  .roundtitle .tag{ font-size:11px; font-weight:400; color:var(--text-dim); border:1px solid var(--border-soft); padding:2px 8px; border-radius:20px; margin-left:6px; }
  .roundpicker{ width:auto; max-width:230px; font-size:15px; }
  .board{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .mrow{ display:flex; align-items:center; gap:12px; padding:7px 0; border-bottom:1px solid var(--border-soft); }
  .mrow:last-child{ border-bottom:none; }
  .w-en2{ flex:1; color:var(--en); font-weight:600; font-size:14.5px; }
  .slot{ flex:1; min-height:38px; border:2px dashed var(--border); border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; color:var(--text-dim); transition:border-color .15s, background .15s; }
  .slot.correct{ border:2px solid var(--good); background:var(--good-bg); color:var(--nl); font-weight:700; }
  .slot.incorrect{ border-color:var(--bad); background:var(--bad-bg); }
  .slot.dragover{ border-color:var(--accent); }
  .bank{ margin-top:18px; padding-top:14px; border-top:1px dashed var(--border-soft); display:flex; flex-wrap:wrap; gap:9px; min-height:44px; }
  .chip{ background:var(--panel2); border:2px solid var(--nl); color:var(--nl); font-weight:700; padding:8px 13px; border-radius:20px; cursor:grab; font-size:14px; touch-action:manipulation; user-select:none; }
  .chip.sel{ background:var(--nl); color:#1a1200; box-shadow:0 0 0 3px rgba(251,191,36,.35); }
  .donebar{ margin-top:12px; text-align:center; font-size:13px; color:var(--good); font-weight:600; min-height:18px; }
  .matchbtns{ display:flex; gap:10px; justify-content:center; margin-top:14px; }
  .matchbtns button{ background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:8px 14px; font-size:13px; cursor:pointer; }
  .matchbtns button:disabled{ opacity:.35; cursor:default; }
  @media (max-width:480px){ .mrow{ flex-direction:column; align-items:stretch; gap:6px; } }

  /* ---------- order (zinnen bouwen) ---------- */
  .ordertarget{ min-height:46px; border:2px dashed var(--border); border-radius:10px; padding:8px; display:flex; flex-wrap:wrap; gap:6px; margin-top:11px; align-items:center; }
  .ordertarget.done{ border:2px solid var(--good); background:var(--good-bg); }
  .ordertarget.shake{ animation:shake .4s; }
  @keyframes shake{ 0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)} 40%{transform:translateX(5px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
  .orderbank{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
  .otok{ background:var(--panel2); border:2px solid var(--accent); color:var(--text); border-radius:8px; padding:7px 11px; font-size:14px; cursor:pointer; user-select:none; touch-action:manipulation; }
  .otok.bankchip{ border-color:var(--nl); color:var(--nl); font-weight:600; }
  .otok.fixed{ border-color:var(--good); color:var(--good); cursor:default; }
  .orderplaceholder{ color:var(--text-dim); font-size:13px; }
  .orderhint{ font-size:12.5px; margin-top:7px; min-height:16px; }
  .orderhint.good{ color:var(--good); font-weight:600; }
  .orderhint.bad{ color:var(--bad); }
  .c-en{ color:var(--en); font-weight:600; font-size:14.5px; }

  /* ---------- type (vertaal & typ) ---------- */
  .typerow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .typeinput{ flex:1; min-width:180px; background:var(--panel2); border:2px solid var(--border); border-radius:8px; color:var(--text); font-size:16px; padding:9px 11px; }
  .typeinput:focus{ outline:none; border-color:var(--accent); }
  .typeinput.green{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .typeinput.yellow{ border-color:var(--nl); background:rgba(251,191,36,0.12); color:var(--nl); }
  .typeinput.red{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .typeinput:disabled{ opacity:.9; }
  .typebtn{ background:var(--panel2); border:2px solid var(--border); color:var(--text); border-radius:8px; padding:9px 14px; font-size:14px; font-weight:600; cursor:pointer; white-space:nowrap; }
  .typebtn:hover{ border-color:var(--accent); }
  .typebtn.ghost{ background:none; border-color:var(--border-soft); color:var(--text-dim); margin-top:8px; font-weight:400; }
  .typefb{ font-size:12.5px; margin-top:8px; min-height:16px; color:var(--text-dim); }
  .typefb.green{ color:var(--good); font-weight:600; }
  .typefb.yellow{ color:var(--nl); }
  .typefb.red{ color:var(--bad); }

  /* ---------- mascotte (hondje) ---------- */
  .mascot{ position:fixed; right:12px; bottom:14px; z-index:60; display:flex; align-items:flex-end; gap:7px;
    transform:translateX(135%); opacity:0; pointer-events:none;
    transition:transform .5s cubic-bezier(.3,1.4,.5,1), opacity .3s; }
  .mascot.show{ transform:none; opacity:1; pointer-events:auto; }
  .mascot-dog{ width:82px; height:82px; flex:none; cursor:pointer; filter:drop-shadow(0 6px 13px rgba(0,0,0,.38)); animation:dogbob 2.8s ease-in-out infinite; }
  .mascot-dog svg{ width:100%; height:100%; display:block; overflow:visible; }
  .mascot-bubble{ position:relative; max-width:236px; background:var(--panel); border:1px solid var(--border); border-radius:13px 13px 4px 13px;
    padding:10px 26px 8px 12px; font-size:12.5px; line-height:1.45; color:var(--text); box-shadow:0 8px 20px rgba(0,0,0,.28); }
  .mascot-bubble:after{ content:""; position:absolute; right:-7px; bottom:11px; width:12px; height:12px; background:var(--panel);
    border-right:1px solid var(--border); border-bottom:1px solid var(--border); transform:rotate(-45deg); }
  .mascot-x{ position:absolute; top:3px; right:5px; background:none; border:none; color:var(--text-dim); font-size:15px; line-height:1; cursor:pointer; padding:2px 5px; }
  .mascot-x:hover{ color:var(--text); }
  .mascot-lang{ display:flex; gap:4px; margin-top:7px; }
  .mascot-lang button{ font-size:10px; font-weight:700; letter-spacing:.02em; padding:2px 7px; border-radius:6px;
    border:1px solid var(--border-soft); background:var(--panel2); color:var(--text-dim); cursor:pointer; }
  .mascot-lang button.on{ background:var(--accent); color:#160e2e; border-color:var(--accent); }
  .dog-lid{ transform-box:fill-box; transform-origin:top center; transform:scaleY(0); animation:dogblink 4.6s infinite; }
  .dog-tail{ transform-box:fill-box; transform-origin:85% 88%; animation:dogwag .5s ease-in-out infinite; }
  .dog-ear{ transform-box:fill-box; transform-origin:top center; }
  .mascot.show .dog-ear-l{ animation:dogear .5s ease 2; }
  .mascot.show .dog-ear-r{ animation:dogear .5s ease 2 reverse; }
  .mascot.celebrate .mascot-dog{ animation:doghop .5s ease 3; }
  .mascot .spark{ position:absolute; width:10px; height:10px; pointer-events:none; color:var(--nl); font-size:12px; animation:sparkup .9s ease forwards; }
  @keyframes dogbob{ 50%{ transform:translateY(-5px); } }
  @keyframes dogblink{ 0%,91%,100%{ transform:scaleY(0); } 95%{ transform:scaleY(1); } }
  @keyframes dogwag{ 0%,100%{ transform:rotate(-5deg); } 50%{ transform:rotate(12deg); } }
  @keyframes dogear{ 0%,100%{ transform:rotate(0); } 50%{ transform:rotate(-14deg); } }
  @keyframes doghop{ 0%,100%{ transform:translateY(0) rotate(0); } 40%{ transform:translateY(-14px) rotate(-7deg); } 70%{ transform:translateY(0) rotate(5deg); } }
  @keyframes sparkup{ 0%{ transform:translateY(0) scale(.4); opacity:0; } 30%{ opacity:1; } 100%{ transform:translateY(-34px) scale(1.1); opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    .mascot-dog, .mascot.show .dog-ear-l, .mascot.show .dog-ear-r, .mascot.celebrate .mascot-dog, .dog-lid, .dog-tail{ animation:none; }
    .mascot{ transition:opacity .3s; transform:none; }
  }
  @media (max-width:520px){
    .mascot{ right:8px; bottom:10px; }
    .mascot-dog{ width:68px; height:68px; }
    .mascot-bubble{ max-width:184px; font-size:12px; padding:9px 24px 7px 10px; }
  }

  /* ---------- choice / flash ---------- */
  .q{ font-size:14.5px; font-weight:600; margin-bottom:10px; }
  .choiceopts{ display:flex; flex-wrap:wrap; gap:8px; }
  .choicebtn{ background:var(--panel2); border:2px solid var(--border); color:var(--text); border-radius:8px; padding:8px 13px; font-size:14px; font-weight:600; cursor:pointer; }
  .choicebtn.correct{ border-color:var(--good); background:var(--good-bg); color:var(--good); }
  .choicebtn.incorrect{ border-color:var(--bad); background:var(--bad-bg); color:var(--bad); }
  .flashcard{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:15px 16px; margin-bottom:12px; }
  .flashcard.known{ border-color:var(--good); }
  .flashfront{ font-size:15px; font-weight:700; color:var(--en); }
  .flashback{ font-size:15px; color:var(--nl); font-weight:700; margin-top:8px; }
  .flashactions{ display:flex; gap:8px; margin-top:10px; }
  .fbtn{ background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:7px 12px; font-size:13px; cursor:pointer; }
  .fbtn.good{ border-color:var(--good); color:var(--good); }

  /* ---------- modal ---------- */
  .modal-back{ position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal{ background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:18px; width:100%; max-width:340px; }
  .modal h2{ font-size:16px; margin:0 0 12px; }
  .mbtn{ display:block; width:100%; text-align:left; background:var(--panel2); border:1px solid var(--border); color:var(--text); border-radius:9px; padding:11px 13px; font-size:14px; cursor:pointer; margin-bottom:8px; }
  .mbtn:hover{ border-color:var(--accent); }
  .mbtn.danger:hover{ border-color:var(--bad); color:var(--bad); }
  .mbtn.ghost{ background:none; text-align:center; color:var(--text-dim); }
  .modal p.dim{ margin:0 0 10px; }
  .iobox{ width:100%; height:120px; resize:vertical; background:var(--panel2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11px; padding:8px; margin-bottom:10px; }
  .modalrow{ display:flex; gap:8px; margin-bottom:8px; }
  .modalrow .btn-accent{ flex:1; }
  .storenote{ text-align:center; font-size:11.5px; color:var(--text-dim); padding:16px 20px 4px; }

  /* ============ LEERPAD (Duolingo-stijl) ============ */
  :root{
    --green:#58cc02; --green-d:#46a302;
    --blue:#1cb0f6; --gold:#ffc800; --red-x:#ff4b4b; --wrong-bg:rgba(255,75,75,.14);
    --ok-bg:rgba(88,204,2,.16); --almost:#ffc800; --almost-bg:rgba(255,200,0,.16);
  }
  body{ background:var(--bg); }
  #app{ position:relative; z-index:1; }

  /* ===== speelse geanimeerde achtergrond ===== */
  #scene{ position:fixed; inset:0; z-index:0; overflow:hidden; pointer-events:none; }
  #scene .sky{ position:absolute; inset:0;
    background:linear-gradient(180deg, #8fd3ff 0%, #bfe6ff 42%, #e7f7ff 66%, #dff3d0 100%); }
  #scene .sun{ position:absolute; top:-26px; right:-26px; width:150px; height:150px; border-radius:50%;
    background:radial-gradient(circle at 42% 42%, #fff3b0, #ffd84d 62%, #ffc21f 100%);
    box-shadow:0 0 60px 18px rgba(255,214,77,.55); animation:sunpulse 6s ease-in-out infinite; }
  #scene .sun:before{ content:""; position:absolute; inset:-34px; border-radius:50%;
    background:conic-gradient(from 0deg, rgba(255,221,120,.55) 0 8deg, transparent 8deg 30deg);
    -webkit-mask:radial-gradient(circle, transparent 58%, #000 60%); mask:radial-gradient(circle, transparent 58%, #000 60%);
    animation:spin 40s linear infinite; }
  #scene .cloud{ position:absolute; width:130px; height:42px; background:#fff; border-radius:40px;
    filter:drop-shadow(0 8px 10px rgba(80,120,160,.12)); opacity:.9; animation:drift linear infinite; }
  #scene .cloud:before,#scene .cloud:after{ content:""; position:absolute; background:#fff; border-radius:50%; }
  #scene .cloud:before{ width:56px; height:56px; left:16px; top:-24px; }
  #scene .cloud:after{ width:40px; height:40px; right:20px; top:-16px; }
  #scene .flyword{ position:absolute; font-weight:800; font-size:15px; color:rgba(30,70,110,.42);
    white-space:nowrap; animation:flyby linear forwards; text-shadow:0 1px 0 rgba(255,255,255,.6); }
  #scene .hopper{ position:absolute; bottom:8px; font-size:22px; animation:hopby linear forwards; }
  #scene .hopper span{ display:inline-block; animation:hopY .45s ease-in-out infinite; }
  #scene .ground{ position:absolute; left:0; right:0; bottom:0; height:80px;
    background:linear-gradient(180deg, #cdeeae, #9fd97e); border-top-left-radius:50% 22px; border-top-right-radius:50% 22px; }
  @keyframes sunpulse{ 50%{ transform:scale(1.05); box-shadow:0 0 78px 26px rgba(255,214,77,.6); } }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  @keyframes drift{ from{ transform:translateX(-160px); } to{ transform:translateX(calc(100vw + 160px)); } }
  @keyframes flyby{ 0%{ transform:translate(-30vw,0) rotate(-4deg); opacity:0; }
    10%{ opacity:.5; } 90%{ opacity:.5; } 100%{ transform:translate(90vw,-16px) rotate(4deg); opacity:0; } }
  @keyframes hopby{ 0%{ transform:translateX(-12vw) translateY(0); } 100%{ transform:translateX(112vw) translateY(0); } }
  @keyframes hopY{ 50%{ transform:translateY(-16px); } }

  /* per-eenheid thema-band achter het pad */
  .unit-wrap{ position:relative; border-radius:20px; margin:4px 0; padding:2px 0 10px;
    background:linear-gradient(180deg, var(--b1), var(--b2)); overflow:hidden; }
  .unit-wrap .band-deco{ position:absolute; z-index:1; pointer-events:none; opacity:.92; font-size:27px;
    animation:floaty 7s ease-in-out infinite; filter:drop-shadow(0 3px 4px rgba(0,0,0,.12)); }
  .unit-wrap .band-deco.s{ font-size:18px; opacity:.75; }
  .unit-wrap .band-beau{ position:absolute; bottom:8px; width:74px; height:auto; animation:walkAcross linear infinite; }
  .unit-wrap .band-beau.flip{ transform:scaleX(-1); }
  @keyframes floaty{ 50%{ transform:translateY(-10px) rotate(4deg); } }
  @keyframes walkAcross{ 0%{ left:-90px; } 100%{ left:100%; } }
  .band-beau .wleg{ transform-box:fill-box; transform-origin:top center; }
  .band-beau .wleg-f1,.band-beau .wleg-b2{ animation:trot .5s ease-in-out infinite; }
  .band-beau .wleg-f2,.band-beau .wleg-b1{ animation:trot .5s ease-in-out infinite reverse; }
  .band-beau .wtail{ transform-box:fill-box; transform-origin:0% 100%; animation:dogwag .4s ease-in-out infinite; }
  @keyframes trot{ 50%{ transform:rotate(24deg); } }

  @media (prefers-reduced-motion: reduce){
    #scene .cloud,#scene .flyword,#scene .hopper,#scene .sun,#scene .sun:before,
    .unit-wrap .band-deco,.unit-wrap .band-beau,.band-beau .wleg,.band-beau .wtail{ animation:none !important; }
    #scene .flyword,#scene .hopper{ display:none; }
  }
  .d-btn{
    background:var(--green); color:#08340a; border:none; border-radius:14px; font-weight:800;
    font-size:15px; letter-spacing:.02em; padding:13px 18px; cursor:pointer; width:100%;
    box-shadow:0 4px 0 var(--green-d); transition:transform .06s, box-shadow .06s, filter .15s;
    text-transform:uppercase;
  }
  .d-btn:hover{ filter:brightness(1.05); }
  .d-btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--green-d); }
  .d-btn:disabled{ background:var(--panel2); color:var(--text-dim); box-shadow:0 4px 0 var(--border); cursor:default; filter:none; }
  .d-btn.big{ padding:15px; font-size:16px; }
  .d-btn.wrong{ background:var(--red-x); box-shadow:0 4px 0 #c92c2c; color:#fff; }
  .d-btn.ok{ background:var(--green); box-shadow:0 4px 0 var(--green-d); }
  .d-btn.retry{ background:var(--gold); box-shadow:0 4px 0 #c99e00; color:#4a3800; }

  .duo-top{ position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:10px 16px 8px; background:rgba(255,255,255,.88); backdrop-filter:blur(8px); }
  .duo-top-r{ display:flex; align-items:center; gap:8px; }
  .duo-stat{ display:flex; align-items:center; gap:4px; font-size:13px; background:var(--panel2);
    border:1px solid var(--border); border-radius:20px; padding:5px 10px; color:var(--text); }
  .duo-stat b{ font-weight:800; }
  .duo-stat.streak{ color:#ff9600; } .duo-stat.xp{ color:var(--gold); }
  .duo-stat.sndtog{ cursor:pointer; font-size:15px; padding:5px 9px; }
  .duo-stat.sndtog.on{ border-color:var(--blue); }
  .duo-tabs{ position:sticky; top:46px; z-index:19; display:flex; gap:6px; padding:0 12px 10px;
    background:rgba(255,255,255,.88); backdrop-filter:blur(8px); border-bottom:1px solid var(--border); }
  .duo-tab{ flex:1; background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:9px 6px; font-size:12.5px; font-weight:700; color:var(--text-dim); cursor:pointer; }
  .duo-tab.on{ color:var(--text); border-color:var(--accent); background:var(--panel2); box-shadow:0 3px 0 rgba(167,139,250,.25); }

  .duo-path{ position:relative; max-width:520px; margin:0 auto; padding:14px 20px 90px; }
  .duo-unit{ position:relative; border-radius:16px; padding:14px 16px; margin:26px 0 8px;
    background:linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 62%, #000)); color:#fff;
    box-shadow:0 5px 0 color-mix(in srgb, var(--c) 55%, #000); }
  .duo-unit.gild{ outline:2px solid var(--gold); outline-offset:2px; }
  .duo-unit-h{ display:flex; flex-direction:column; gap:2px; }
  .duo-unit-n{ font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; opacity:.85; }
  .duo-unit-t{ font-size:16px; font-weight:800; }
  .duo-trail{ display:flex; flex-direction:column; align-items:center; gap:16px; padding:16px 0 6px; }
  .duo-node{ position:relative; width:60px; height:56px; border-radius:50%; border:none; cursor:pointer;
    font-size:22px; color:#fff; background:var(--c);
    box-shadow:0 6px 0 color-mix(in srgb, var(--c) 55%, #000); transition:transform .08s; }
  .duo-node:active{ transform:translateY(3px); }
  .duo-node.lock{ background:#dbe5f0; color:#8ba0b4; box-shadow:0 6px 0 #c3d1e0; cursor:default; }
  .duo-node.done{ background:var(--gold); box-shadow:0 6px 0 #c99e00; color:#5a4600; }
  .duo-node.rev{ border-radius:16px; }
  .duo-node.cur{ transform:scale(1.14); box-shadow:0 8px 0 color-mix(in srgb, var(--c) 55%, #000); animation:nodePulse 1.8s ease-in-out infinite; }
  .duo-node-cr{ position:absolute; left:0; right:0; bottom:-16px; font-size:11px; letter-spacing:2px; color:var(--gold); text-shadow:0 1px 2px #000; }
  @keyframes nodePulse{ 50%{ filter:brightness(1.14); } }
  .duo-beau{ position:absolute; width:56px; height:56px; pointer-events:none; transition:top .4s, left .4s; z-index:5; filter:drop-shadow(0 4px 8px rgba(0,0,0,.4)); }
  .duo-beau svg{ width:100%; height:100%; }

  /* review-tab */
  .duo-review{ max-width:520px; margin:0 auto; padding:18px 20px 80px; }
  .duo-review h1{ font-size:20px; margin:6px 0 8px; }
  .duo-review .d-btn{ margin:12px 0 18px; }
  .duo-weaklist{ display:flex; flex-direction:column; gap:6px; }
  .duo-weak{ display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--border);
    border-radius:10px; padding:9px 12px; font-size:13.5px; }
  .duo-weak span{ flex:1; } .duo-weak span.nl{ color:var(--nl); font-weight:700; text-align:right; }

  /* ---------- les-speler ---------- */
  .lx{ max-width:560px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  .lx-top{ display:flex; align-items:center; gap:12px; padding:14px 18px 6px; }
  .lx-x{ background:none; border:none; color:var(--text-dim); font-size:20px; cursor:pointer; line-height:1; }
  .lx-bar{ flex:1; height:14px; background:var(--panel2); border-radius:10px; overflow:hidden; }
  .lx-fill{ height:100%; width:0; background:linear-gradient(90deg,var(--green),#7be23f); border-radius:10px; transition:width .3s; }
  .lx-body{ flex:1; padding:20px 20px 10px; }
  .lx-q{ font-size:19px; font-weight:800; margin-bottom:16px; text-wrap:balance; }
  .lx-prompt{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--panel); border:2px solid var(--border);
    border-radius:14px; padding:16px 18px; margin-bottom:18px; }
  .lx-prompt.sm{ padding:13px 15px; }
  .lx-prompt-t{ font-size:20px; font-weight:700; color:var(--en); }
  .lx-opts{ display:flex; flex-direction:column; gap:10px; }
  .lx-opt{ display:flex; align-items:center; justify-content:space-between; gap:10px; text-align:left;
    background:var(--panel); border:2px solid var(--border); border-radius:14px; padding:14px 16px;
    font-size:16px; color:var(--text); cursor:pointer; box-shadow:0 3px 0 var(--border); transition:transform .06s; }
  .lx-opt:active{ transform:translateY(2px); }
  .lx-opt.sel{ border-color:var(--blue); box-shadow:0 3px 0 #1483bd; background:rgba(28,176,246,.1); }
  .lx-opt.good{ border-color:var(--green); background:var(--ok-bg); box-shadow:0 3px 0 var(--green-d); }
  .lx-opt.bad{ border-color:var(--red-x); background:var(--wrong-bg); box-shadow:0 3px 0 #c92c2c; }
  .lx-opt.done{ opacity:.4; }
  .lx-opt.m{ box-shadow:none; }
  .lx-input{ width:100%; background:var(--panel); border:2px solid var(--border); border-radius:14px;
    color:var(--text); font-size:18px; padding:14px 16px; }
  .lx-input:focus{ outline:none; border-color:var(--blue); }
  .lx-hint{ margin-top:12px; font-size:13px; color:var(--text-dim); font-style:italic; }
  .lx-bigspk{ display:block; margin:6px auto 4px; width:96px; height:96px; border-radius:24px; border:2px solid var(--blue);
    background:rgba(28,176,246,.12); color:var(--blue); cursor:pointer; box-shadow:0 5px 0 #1483bd; }
  .lx-bigspk:active{ transform:translateY(3px); box-shadow:0 2px 0 #1483bd; }
  .lx-slow{ display:block; margin:8px auto 16px; background:none; border:none; color:var(--text-dim); font-size:13px; cursor:pointer; text-decoration:underline; }
  .lx-build-target{ min-height:56px; border-bottom:2px dashed var(--border); display:flex; flex-wrap:wrap; gap:8px; padding:10px 2px; margin-bottom:16px; align-items:center; }
  .lx-build-bank{ display:flex; flex-wrap:wrap; gap:8px; min-height:44px; }
  .lx-ph{ color:var(--text-dim); }
  .lx-tok{ background:var(--panel); border:2px solid var(--border); border-radius:12px; padding:9px 13px;
    font-size:15px; color:var(--text); cursor:pointer; box-shadow:0 3px 0 var(--border); }
  .lx-tok:active{ transform:translateY(2px); }
  .lx-tok:disabled{ opacity:.5; }
  .lx-match{ display:flex; gap:12px; }
  .lx-match-col{ flex:1; display:flex; flex-direction:column; gap:9px; }
  .lx-mic{ display:block; width:100%; background:rgba(206,130,255,.12); border:2px solid var(--accent); color:var(--accent);
    border-radius:14px; padding:16px; font-size:16px; font-weight:700; cursor:pointer; box-shadow:0 4px 0 #7a4fb5; }
  .lx-mic.rec{ animation:micpulse .9s ease-in-out infinite; }
  @keyframes micpulse{ 50%{ background:rgba(206,130,255,.28); } }
  .lx-heard{ margin-top:12px; font-size:14px; color:var(--text-dim); text-align:center; min-height:18px; }
  .lx-heard.ok{ color:var(--green); font-weight:700; } .lx-heard.bad{ color:var(--red-x); }
  .lx-foot{ position:sticky; bottom:0; padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    background:var(--bg); border-top:1px solid var(--border); }
  .lx-banner{ max-height:0; overflow:hidden; font-size:14px; font-weight:700; border-radius:12px; transition:max-height .2s, padding .2s; }
  .lx-banner.show{ max-height:110px; padding:12px 14px; margin-bottom:12px; }
  .lx-banner span{ display:block; font-weight:800; margin-top:3px; }
  .lx-banner.ok{ background:var(--ok-bg); color:var(--green); }
  .lx-banner.almost{ background:var(--almost-bg); color:#b98900; }
  .lx-banner.bad{ background:var(--wrong-bg); color:var(--red-x); }

  .lx-end{ max-width:520px; margin:0 auto; padding:60px 24px; text-align:center; }
  .lx-end-emoji{ font-size:60px; }
  .lx-end h1{ font-size:24px; margin:8px 0 22px; }
  .lx-stats{ display:flex; gap:10px; justify-content:center; margin-bottom:20px; flex-wrap:wrap; }
  .lx-stat{ flex:1; min-width:96px; border:2px solid var(--c); border-radius:14px; padding:12px 8px; }
  .lx-stat-l{ font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; }
  .lx-stat-v{ font-size:18px; font-weight:800; color:var(--c); margin-top:3px; }
  .lx-crowns{ font-size:18px; margin-bottom:20px; letter-spacing:2px; }

  .spk{ display:inline-flex; align-items:center; justify-content:center; width:30px; height:30px; flex:none;
    border-radius:9px; border:1px solid var(--border-soft); background:var(--panel2); color:var(--blue); cursor:pointer; }
  .spk:active{ transform:scale(.92); }
  .spk.mini{ width:26px; height:26px; }
  .spk.inline{ width:28px; height:28px; }

  .confetti{ position:fixed; inset:0; pointer-events:none; z-index:80; overflow:hidden; }
  .confetti i{ position:absolute; top:-12px; width:10px; height:16px; border-radius:2px; animation:conffall 2.6s linear forwards; }
  @keyframes conffall{ to{ transform:translateY(108vh) rotate(680deg); opacity:.2; } }

  /* ===== beloningen ===== */
  .rewardpop{ position:fixed; left:50%; top:40%; z-index:92; pointer-events:none; white-space:nowrap;
    font-size:36px; font-weight:900; letter-spacing:.01em; color:#ff9500;
    -webkit-text-stroke:3px #fff; paint-order:stroke fill;
    filter:drop-shadow(0 5px 10px rgba(0,0,0,.22));
    transform:translate(-50%,-50%) scale(.3);
    animation:rewardpop 1.1s cubic-bezier(.18,1.5,.4,1) forwards; }
  .rewardpop.big{ font-size:48px; top:36%; color:#ff5b7f; }
  @keyframes rewardpop{
    0%{ transform:translate(-50%,-50%) scale(.3) rotate(-9deg); opacity:0; }
    26%{ transform:translate(-50%,-50%) scale(1.18) rotate(4deg); opacity:1; }
    46%{ transform:translate(-50%,-50%) scale(1) rotate(-2deg); }
    78%{ opacity:1; }
    100%{ transform:translate(-50%,-72%) scale(1) rotate(0); opacity:0; } }
  .sparkbox{ position:fixed; z-index:91; pointer-events:none; }
  .sparkbox i{ position:absolute; left:0; top:0; width:10px; height:10px; border-radius:2px;
    animation:sparkfly .78s ease-out forwards; }
  @keyframes sparkfly{ 0%{ transform:translate(0,0) scale(1); opacity:1; }
    100%{ transform:translate(var(--dx),var(--dy)) scale(.15) rotate(180deg); opacity:0; } }

  .lx-end-emoji.pop{ animation:trophypop 1s cubic-bezier(.2,1.6,.35,1) both; }
  @keyframes trophypop{ 0%{ transform:scale(0) rotate(-30deg); } 55%{ transform:scale(1.3) rotate(12deg); }
    72%{ transform:scale(.92) rotate(-6deg); } 100%{ transform:scale(1) rotate(0); } }
  .lx-crowns{ font-size:30px; letter-spacing:6px; margin-bottom:6px; }
  .lx-crowns span{ display:inline-block; transform:scale(0); animation:crownpop .5s cubic-bezier(.2,1.7,.4,1) forwards; }
  .lx-crowns span.old{ opacity:.5; }
  @keyframes crownpop{ 0%{ transform:scale(0) rotate(-20deg); } 60%{ transform:scale(1.35) rotate(10deg); } 100%{ transform:scale(1) rotate(0); } }
  .lx-crowns-l{ font-size:12px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.08em; margin-bottom:16px; }
  .lx-ribbon{ display:inline-block; margin:2px auto 18px; padding:8px 18px; border-radius:999px;
    font-weight:900; font-size:14px; color:#fff; letter-spacing:.03em;
    background:linear-gradient(90deg,#ff8c00,#ff5b7f); box-shadow:0 6px 16px rgba(255,91,127,.35);
    animation:ribbonin .6s cubic-bezier(.2,1.5,.4,1) both; }
  @keyframes ribbonin{ 0%{ transform:scale(.4) rotate(-4deg); opacity:0; } 100%{ transform:scale(1) rotate(0); opacity:1; } }

  .duo-node.juststamp{ animation:juststamp 1s cubic-bezier(.2,1.7,.4,1) both; }
  @keyframes juststamp{ 0%{ transform:scale(.2) rotate(-20deg); } 55%{ transform:scale(1.4) rotate(10deg); }
    75%{ transform:scale(.94); } 100%{ transform:scale(1) rotate(0); } }

  /* ===== A/B/C/D vraag ===== */
  .lx-opts.abcd .lx-opt.quiz{ align-items:center; gap:12px; }
  .lx-abcd{ flex:none; width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:14px; background:var(--panel2); color:var(--accent); border:1px solid var(--border); }
  .lx-opt.quiz.sel .lx-abcd{ background:var(--blue); color:#fff; border-color:var(--blue); }
  .lx-opt.quiz.good .lx-abcd{ background:var(--green); color:#fff; }
  .lx-opt.quiz.bad .lx-abcd{ background:var(--red-x); color:#fff; }
  .lx-opt-t{ flex:1; }

  @media (prefers-reduced-motion: reduce){
    .confetti,.duo-node.cur,.rewardpop,.sparkbox i,.lx-end-emoji.pop,.lx-crowns span,.lx-ribbon,.duo-node.juststamp{ animation:none; }
    .rewardpop{ opacity:1; transform:translate(-50%,-50%); }
  }

  /* ===== licht thema: witte kaarten, leesbare tekst ===== */
  .duo-tab{ box-shadow:var(--card-shadow); }
  .duo-tab.on{ box-shadow:0 3px 0 var(--accent); }
  .mcard,.rulebox,.introtext,.list,.card,.board,.duo-weak{ box-shadow:var(--card-shadow); }
  .duo-node-cr{ color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.4); }
  .lx-q{ text-shadow:0 1px 0 rgba(255,255,255,.5); }
  .lx{ background:rgba(255,255,255,.6); -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px); border-radius:0; }
  .lx-foot{ background:linear-gradient(180deg, rgba(255,255,255,.4), var(--panel)); }
  .lx-opt,.lx-prompt,.lx-input,.lx-tok{ box-shadow:var(--card-shadow); }
  .storenote{ color:var(--text-dim); }

  /* ===== mobiel: app-look met vaste onderbalk ===== */
  @media (max-width:640px){
    #app{ padding-bottom:72px; }
    .duo-tabs{ position:fixed; left:0; right:0; bottom:0; top:auto; z-index:45;
      gap:0; padding:6px 6px calc(6px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,.96); border-top:1px solid var(--border); border-bottom:none;
      box-shadow:0 -6px 18px rgba(40,70,110,.1); }
    .duo-tab{ background:none; border:none; box-shadow:none; border-radius:12px;
      display:flex; flex-direction:column; align-items:center; gap:2px; font-size:10.5px; padding:6px 2px; }
    .duo-tab .ti{ font-size:20px; line-height:1; }
    .duo-tab.on{ background:var(--panel2); box-shadow:none; color:var(--accent); }
    .duo-top{ position:sticky; }
    .duo-path{ padding-bottom:96px; }
    .duo-review,.hub-grid,.hubfoot{ padding-bottom:90px; }
    .topbar .backbtn{ display:none; }
  }
</style>

<body>
<div id="app"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script>
/* ============================================================
   NEDERLANDS LEREN  -  alles in 1 bestand
   Werkt op Mac en iPhone (open in Safari of "Zet op beginscherm").

   VOORTGANG: standaard lokaal (per toestel, in de browser).
   Vul FIREBASE_CONFIG hieronder in (zoek op "FIREBASE_CONFIG")
   om de voortgang online te bewaren zodat ze op elk toestel
   terugkomt onder dezelfde profielnaam. Zie FIREBASE-instellen.md.

   -------- NIEUWE MODULE TOEVOEGEN --------
   Voeg 1 object toe aan de MODULES-lijst hieronder.
   Verplicht : id (uniek, nooit meer veranderen), title, type, data

const NS = "ndl_v1";
function lsGet(k, def){ try{ const v = localStorage.getItem(k); return v == null ? def : JSON.parse(v); } catch(e){ return def; } }
function lsSet(k, val){ try{ localStorage.setItem(k, JSON.stringify(val)); } catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); } catch(e){} }

let STORE = "local";            // "local" | "cloud"
let fdb = null;                  // Firestore handle
const cache = {};               // { profileName: { moduleId: {key:true} } }
let profileNames = [];
let currentProfile = null;
const flushTimers = {};

function slugify(name){
  const s = String(name).trim();
  let base = s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+/, "").replace(/-+$/, "").slice(0, 80);
  if(!base) base = "p";
  let h = 0;
  for(let i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
  return base + "-" + h.toString(36);
}
function blankProgress(){ const o = {}; MODULES.forEach(m => { o[m.id] = {}; }); return o; }
function cloudConfigured(){
  try {
    return FIREBASE_CONFIG && typeof FIREBASE_CONFIG === "object" &&
      ["apiKey","projectId","appId"].every(k => typeof FIREBASE_CONFIG[k] === "string" &&
        FIREBASE_CONFIG[k] && FIREBASE_CONFIG[k].indexOf("PLAK") < 0);
  } catch(e){ return false; }
}

async function storeInit(){
  currentProfile = lsGet(NS + "_current", null);
  if(cloudConfigured() && typeof firebase !== "undefined" && firebase.firestore){
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      fdb = firebase.firestore();
      try { await fdb.enablePersistence({ synchronizeTabs: true }); } catch(e){}
      STORE = "cloud";
    } catch(e){
      console.warn("Firebase niet beschikbaar — lokale opslag wordt gebruikt.", e);
      STORE = "local";
    }
  }
  await loadProfileList();
  window.addEventListener("pagehide", () => { if(currentProfile && STORE === "cloud") flushNow(currentProfile); });
  window.addEventListener("beforeunload", () => { if(currentProfile && STORE === "cloud") flushNow(currentProfile); });
}

async function loadProfileList(){
  if(STORE === "cloud"){
    try {
      const snap = await fdb.collection("profielen").get();
      profileNames = [];
      snap.forEach(d => {
        const x = d.data() || {};
        const nm = x.name || d.id;
        profileNames.push(nm);
        cache[nm] = normaliseProgress(x.progress);
      });
      return;
    } catch(e){
      console.warn("Profielen laden mislukt — lokale opslag wordt gebruikt.", e);
      STORE = "local";
    }
  }
  profileNames = lsGet(NS + "_profiles", []) || [];
  profileNames.forEach(n => { if(!cache[n]) cache[n] = loadLocalProfile(n); });
}

// In de cloud bewaren we per module een LIJST van afgeronde sleutels
// (Firestore-map-sleutels mogen geen "." bevatten; zinnen wél). In het
// geheugen blijft het een {sleutel:true}-object voor de renderers.
function normaliseProgress(p){
  const o = blankProgress();
  if(p && typeof p === "object"){
    MODULES.forEach(m => {
      const v = p[m.id];
      if(Array.isArray(v)) v.forEach(k => { if(k != null) o[m.id][String(k)] = true; });
      else if(v && typeof v === "object") Object.keys(v).forEach(k => { if(v[k] === true) o[m.id][k] = true; });
    });
    if(p._path && typeof p._path === "object") o._path = p._path;
  }
  return o;
}
function progressToArrays(prog){
  const o = {};
  MODULES.forEach(m => { o[m.id] = Object.keys(prog[m.id] || {}).filter(k => prog[m.id][k] === true); });
  if(prog._path && typeof prog._path === "object") o._path = prog._path;
  return o;
}
function loadLocalProfile(name){
  const o = blankProgress();
  MODULES.forEach(m => { o[m.id] = lsGet(NS + "_p_" + name + "_" + m.id, {}) || {}; });
  const pth = lsGet(NS + "_p_" + name + "__path", null);
  if(pth && typeof pth === "object") o._path = pth;
  return o;
}

async function ensureLoaded(name){
  if(cache[name]) return;
  if(STORE === "cloud"){
    try {
      const d = await fdb.collection("profielen").doc(slugify(name)).get();
      cache[name] = d.exists ? normaliseProgress((d.data() || {}).progress) : blankProgress();
    } catch(e){ cache[name] = blankProgress(); }
  } else {
    cache[name] = loadLocalProfile(name);
  }
}

function getCurrent(){ return currentProfile; }
function setCurrent(n){ currentProfile = n; if(n == null) lsDel(NS + "_current"); else lsSet(NS + "_current", n); }
function getProfiles(){ return profileNames.slice(); }

function getProgress(name, moduleId){
  if(!cache[name]) cache[name] = blankProgress();
  if(!cache[name][moduleId]) cache[name][moduleId] = {};
  return cache[name][moduleId];
}

function scheduleFlush(name, moduleId){
  if(STORE === "local"){
    lsSet(NS + "_p_" + name + "_" + moduleId, cache[name][moduleId]);
    return;
  }
  clearTimeout(flushTimers[name]);
  flushTimers[name] = setTimeout(() => flushNow(name), 700);
}
async function flushNow(name){
  if(STORE !== "cloud" || !cache[name]) return;
  clearTimeout(flushTimers[name]);
  try {
    await fdb.collection("profielen").doc(slugify(name)).set({
      name: name, progress: progressToArrays(cache[name]), updated: Date.now()
    });
  } catch(e){ console.warn("Online opslaan mislukt — wordt opnieuw geprobeerd bij de volgende wijziging.", e); }
}

async function addProfile(name){
  name = (name || "").trim();
  if(!name) return false;
  const existing = profileNames.find(p => p.toLowerCase() === name.toLowerCase());
  if(existing){ setCurrent(existing); await ensureLoaded(existing); return true; }
  profileNames.push(name);
  cache[name] = blankProgress();
  if(STORE === "cloud"){ await flushNow(name); }
  else { lsSet(NS + "_profiles", profileNames); }
  setCurrent(name);
  return true;
}
async function renameProfile(oldName, newName){
  newName = (newName || "").trim();
  if(!newName || newName === oldName) return;
  if(profileNames.some(p => p.toLowerCase() === newName.toLowerCase() && p !== oldName)){ alert("Die naam bestaat al."); return; }
  await ensureLoaded(oldName);
  const i = profileNames.indexOf(oldName);
  if(i < 0) return;
  profileNames[i] = newName;
  cache[newName] = cache[oldName] || blankProgress();
  delete cache[oldName];
  if(STORE === "cloud"){
    await flushNow(newName);
    try { await fdb.collection("profielen").doc(slugify(oldName)).delete(); } catch(e){}
  } else {
    MODULES.forEach(m => {
      lsSet(NS + "_p_" + newName + "_" + m.id, cache[newName][m.id] || {});
      lsDel(NS + "_p_" + oldName + "_" + m.id);
    });
    if(cache[newName]._path) lsSet(NS + "_p_" + newName + "__path", cache[newName]._path);
    lsDel(NS + "_p_" + oldName + "__path");
    lsSet(NS + "_profiles", profileNames);
  }
  if(getCurrent() === oldName) setCurrent(newName);
}
async function deleteProfile(name){
  profileNames = profileNames.filter(p => p !== name);
  delete cache[name];
  if(STORE === "cloud"){
    try { await fdb.collection("profielen").doc(slugify(name)).delete(); } catch(e){}
  } else {
    MODULES.forEach(m => lsDel(NS + "_p_" + name + "_" + m.id));
    lsDel(NS + "_p_" + name + "__path");
    lsSet(NS + "_profiles", profileNames);
  }
  if(getCurrent() === name) setCurrent(profileNames[0] || null);
}
async function resetModule(name, moduleId){
  if(!cache[name]) cache[name] = blankProgress();
  cache[name][moduleId] = {};
  if(STORE === "cloud"){ await flushNow(name); }
  else { lsSet(NS + "_p_" + name + "_" + moduleId, {}); }
}

function buildExportString(){
  const profiles = profileNames.map(n => ({ name: n, progress: cache[n] || blankProgress() }));
  return JSON.stringify({ app: "nederlands-leren", version: 2, exported: new Date().toISOString(), profiles: profiles }, null, 2);
}
async function applyExportString(text){
  const parsed = JSON.parse(text);
  let n = 0;
  if(parsed && Array.isArray(parsed.profiles)){
    for(const pr of parsed.profiles){
      if(!pr || !pr.name) continue;
      const nm = String(pr.name);
      cache[nm] = normaliseProgress(pr.progress);
      if(profileNames.indexOf(nm) < 0) profileNames.push(nm);
      if(STORE === "cloud"){ await flushNow(nm); }
      else {
        MODULES.forEach(m => lsSet(NS + "_p_" + nm + "_" + m.id, cache[nm][m.id] || {}));
      }
      n++;
    }
    if(STORE !== "cloud") lsSet(NS + "_profiles", profileNames);
    return n;
  }
  // oude backup (versie 1): losse localStorage-sleutels
  const data = parsed && parsed.data ? parsed.data : parsed;
  Object.keys(data || {}).forEach(k => {
    if(k.indexOf(NS) === 0){ try { localStorage.setItem(k, data[k]); n++; } catch(e){} }
  });
  return n;
}

/* =================== COUNTING =================== */
function moduleTotal(m){
  const d = m.data || [];
  switch(m.type){
    case "dehet":     return d.reduce((s, c) => s + c.words.length, 0);
    case "match":     return d.reduce((s, c) => s + c.words.length, 0);
    case "conjug":    return d.reduce((s, v) => s + v.f.filter(x => x !== null && x !== undefined).length, 0);
    case "separable": return d.length * 3;
    case "order":     return d.length;
    case "type":      return d.length;
    case "choice":    return d.length;
    case "flash":     return d.length;
  }
  return 0;
}
function progressCount(prog){ return Object.keys(prog || {}).filter(k => prog[k] === true).length; }
function totalProgressForProfile(p){
  let done = 0, total = 0;
  const c = cache[p] || {};
  MODULES.forEach(m => { total += moduleTotal(m); done += progressCount(c[m.id]); });
  return { done, total };
}

/* =================== HELPERS =================== */
const app = document.getElementById("app");
function el(tag, cls, text){
  const e = document.createElement(tag);
  if(cls) e.className = cls;
  if(text != null) e.textContent = text;
  return e;
}
function esc(s){
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function toArr(x){ return Array.isArray(x) ? x : [x]; }

  bar.appendChild(reset);
  app.appendChild(bar);

  const body = el("div", "mbody");
  app.appendChild(body);

  const total = moduleTotal(m);
  let wasComplete = total > 0 && progressCount(prog) >= total;
  function refreshScore(){
    score.textContent = progressCount(prog) + " / " + total;
    if(!wasComplete && total > 0 && progressCount(prog) >= total){
      wasComplete = true;
      if(typeof sfx === "function") sfx("win");
      if(typeof confetti === "function") confetti();
      if(typeof rewardPop === "function") rewardPop("MODULE KLAAR! 🏆", true);
      if(typeof sparks === "function") setTimeout(() => sparks(window.innerWidth / 2, window.innerHeight * 0.4, 24), 120);
      mascotCelebrate("“" + m.title + "” is helemaal af!", "“" + m.title + "” is all done!");
    }
  }

  reset.onclick = async () => {
    if(confirm("Voortgang van \"" + m.title + "\" wissen voor " + cur + "?")){
      await resetModule(cur, m.id);
      renderModule(m);
    }
  };

  const ctx = { m: m, body: body, prog: prog, save: () => { if(typeof sfx === "function") sfx("correct"); scheduleFlush(cur, m.id); refreshScore(); } };

  if(m.intro || (m.rules && m.rules.length)) body.appendChild(buildIntro(m));

  const renderers = {
    dehet: renderDehet, match: renderMatch, conjug: renderConjug,
    separable: renderSeparable, order: renderOrder, type: renderType,
    choice: renderChoice, flash: renderFlash
  };
  (renderers[m.type] || renderUnknown)(ctx);
  refreshScore();
  window.scrollTo(0, 0);
}

      function lock(){
        deB.disabled = true; hetB.disabled = true;
        (correct === "de" ? deB : hetB).classList.add("correct");

          prog[key] = true; save();

          btn.classList.add("incorrect");

        }
      }
      deB.onclick = () => attempt("de", deB);
      hetB.onclick = () => attempt("het", hetB);
      btns.appendChild(deB); btns.appendChild(hetB);
      row.appendChild(btns);
      list.appendChild(row);
    });

/* =================== TYPE: conjug =================== */
const CONJ_FIELDS = [
  { i: 0, label: "ik" },
  { i: 1, label: "jij / je" },
  { i: 2, label: "hij / zij / het" },
  { i: 3, label: "wij / jullie / zij" },
  { i: 4, label: "verleden (enkelv.)" },
  { i: 5, label: "verleden (meerv.)" },
  { i: 6, label: "voltooid deelwoord" }
];
const GROUP_LABELS = {
  t: "🔷 't kofschip'-werkwoorden",
  d: "🔶 Andere regelmatige werkwoorden",
  irr: "🟥 Onregelmatige / sterke werkwoorden",
  hard: "⬛ Extra moeilijk / gevorderd"
};
function conjAlt(c){
  const s = new Set();
  if(c.endsWith("t")) s.add(c.slice(0, -1)); else s.add(c + "t");
  if(c.endsWith("d")) s.add(c.slice(0, -1)); else s.add(c + "d");
  if(c.endsWith("de")) s.add(c.slice(0, -2) + "te");
  if(c.endsWith("te")) s.add(c.slice(0, -2) + "de");
  if(c.endsWith("den")) s.add(c.slice(0, -3) + "ten");
  if(c.endsWith("ten")) s.add(c.slice(0, -3) + "den");
  if(c.startsWith("ge") && c.length > 3 && c.endsWith("d")) s.add(c.slice(0, -1) + "t");
  if(c.startsWith("ge") && c.length > 3 && c.endsWith("t")) s.add(c.slice(0, -1) + "d");
  s.delete(c);
  return [...s];
}
function conjOptions(correctArr, extras){
  const cs = new Set(correctArr);
  const pool = new Set();
  correctArr.forEach(c => conjAlt(c).forEach(a => { if(!cs.has(a)) pool.add(a); }));
  (extras || []).forEach(e => { if(e && !cs.has(e)) pool.add(e); });
  const need = Math.max(1, 4 - correctArr.length);
  return shuffle([...correctArr, ...shuffle([...pool]).slice(0, need)]);
}
function renderConjug(ctx){
  const { body, prog, save } = ctx;
  let lastGroup = null;
  ctx.m.data.forEach(v => {
    if(v.group && v.group !== lastGroup && GROUP_LABELS[v.group]){
      lastGroup = v.group;
      body.appendChild(el("h2", "section", GROUP_LABELS[v.group]));
    }
    body.appendChild(conjCard(v, prog, save));
  });
}
function conjCard(v, prog, save){
  const card = el("div", "card");
  const top = el("div", "c-top");
  top.innerHTML =
    '<span class="c-en">' + esc(v.en) + '</span><span class="arr">→</span>' +
    '<span class="c-nl">' + esc(v.nl) + '</span>' +
    (v.aux ? '<span class="aux">' + esc(v.aux) + "</span>" : "");
  card.appendChild(top);
  if(v.note) card.appendChild(el("div", "c-note", "⚠ " + v.note));

  const grid = el("div", "cgrid");
  CONJ_FIELDS.forEach(fd => {
    const raw = v.f[fd.i];
    if(raw === null || raw === undefined) return;
    const correctArr = toArr(raw);
    const key = v.nl + "::" + fd.i;
    const wrap = el("div", "field");
    wrap.appendChild(el("label", null, fd.label));
    const sel = document.createElement("select");
    sel.className = "placeholder";
    const ph = document.createElement("option");
    ph.value = ""; ph.textContent = "— kies —";
    sel.appendChild(ph);
    conjOptions(correctArr, [v.nl]).forEach(o => {
      const op = document.createElement("option");
      op.value = o; op.textContent = o;
      sel.appendChild(op);
    });
    if(prog[key]){
      sel.value = correctArr[0];
      sel.classList.remove("placeholder");
      sel.classList.add("correct");
      sel.disabled = true;
    }
    sel.addEventListener("change", () => {
      sel.classList.remove("placeholder", "correct", "incorrect");
      if(sel.value === "") return;
      if(correctArr.indexOf(sel.value) >= 0){
        sel.classList.add("correct");
        sel.disabled = true;
        prog[key] = true; save();
      } else {
        sel.classList.add("incorrect");
        bumpStruggle("conj:" + v.nl, 3, { nl: "'t kofschip: eindigt de stam op t, k, f, s, ch of p? Dan -te / -t. Anders -de / -d.", en: "'t kofschip' rule: does the stem end in t, k, f, s, ch or p? Then -te / -t. Otherwise -de / -d." });
      }
    });
    wrap.appendChild(sel);
    grid.appendChild(wrap);
  });
  card.appendChild(grid);

  if(v.ex){
    const ex = el("div", "cex");
    ex.innerHTML = '<span class="exnl">' + esc(v.ex[0]) + '</span><span class="exen">' + esc(v.ex[1]) + "</span>";
    card.appendChild(ex);
  }
  return card;
}

/* =================== TYPE: separable =================== */
function sepAlt(c){
  const s = new Set();
  if(c.endsWith("t")) s.add(c.slice(0, -1)); else s.add(c + "t");
  if(c.endsWith("d")) s.add(c.slice(0, -1)); else s.add(c + "d");
  s.delete(c);
  return [...s];
}
function sepOptions(correct, extras){
  const pool = new Set();
  sepAlt(correct).forEach(a => { if(a !== correct) pool.add(a); });
  (extras || []).forEach(e => { if(e && e !== correct) pool.add(e); });
  return shuffle([correct, ...shuffle([...pool]).slice(0, 3)]);
}
function sepSelect(key, correct, options, prog, save){
  const sel = document.createElement("select");
  sel.className = "inline placeholder";
  const ph = document.createElement("option");
  ph.value = ""; ph.textContent = "…";
  sel.appendChild(ph);
  options.forEach(o => {
    const op = document.createElement("option");
    op.value = o; op.textContent = o;
    sel.appendChild(op);
  });
  if(prog[key]){
    sel.value = correct;
    sel.classList.remove("placeholder");
    sel.classList.add("correct");
    sel.disabled = true;
  }
  sel.addEventListener("change", () => {
    sel.classList.remove("placeholder", "correct", "incorrect");
    if(sel.value === "") return;
    if(sel.value === correct){
      sel.classList.add("correct");
      sel.disabled = true;
      prog[key] = true; save();
    } else {
      sel.classList.add("incorrect");
      bumpStruggle("sep:" + key, 3, { nl: "In de hoofdzin springt het losse voorvoegsel (op, aan, uit, weg…) helemaal naar het einde van de zin.", en: "In a main clause the separated prefix (op, aan, uit, weg…) jumps all the way to the end of the sentence." });
    }
  });
  return sel;
}
function renderSeparable(ctx){

      } else if(p === "{P}"){

        mrow.appendChild(sepSelect(v.nl + "::P", v.prefix, shuffle([v.prefix, ...others]), prog, save));

}

/* =================== TYPE: match =================== */
function renderMatch(ctx){
  const { body, prog, save } = ctx;
  const rounds = ctx.m.data;

  let cur = rounds.findIndex(r => r.words.some(w => !prog[r.topic + "::" + w[1]]));
  if(cur < 0) cur = 0;

  const nav = el("div", "matchnav");
  const title = el("div", "roundtitle");
  const picker = document.createElement("select");
  picker.className = "roundpicker";
  rounds.forEach((r, i) => {
    const o = document.createElement("option");
    o.value = i;
    o.textContent = "Ronde " + (i + 1) + " – " + r.topic;
    picker.appendChild(o);
  });
  picker.onchange = () => { cur = parseInt(picker.value, 10); draw(); };
  nav.appendChild(title);
  nav.appendChild(picker);
  body.appendChild(nav);

  const board = el("div", "board");
  body.appendChild(board);

  const btnrow = el("div", "matchbtns");
  const prev = el("button", null, "‹ Vorige");
  const next = el("button", null, "Volgende ›");
  prev.onclick = () => { if(cur > 0){ cur--; draw(); } };
  next.onclick = () => { if(cur < rounds.length - 1){ cur++; draw(); } };
  btnrow.appendChild(prev);
  btnrow.appendChild(next);
  body.appendChild(btnrow);

  let selectedChip = null, dragged = null;

  function place(slot, key, correct, word, chip){
    if(word === correct){
      slot.textContent = word;
      slot.classList.remove("incorrect");
      slot.classList.add("correct", "filled");
      prog[key] = true; save();
      if(chip) chip.remove();
      const bank = board.querySelector(".bank");
      if(bank && bank.querySelectorAll(".chip").length === 0){
        const db = board.querySelector(".donebar");
        if(db) db.textContent = "🎉 Ronde voltooid!";
      }
    } else {
      slot.classList.add("incorrect");
      setTimeout(() => slot.classList.remove("incorrect"), 500);
      bumpStruggle("match:" + String(key).split("::")[0], 4, { nl: "Twijfel je? Sla een moeilijke over en kom er later op terug — of denk aan een woord dat erop lijkt.", en: "Not sure? Skip a hard one and come back to it later — or think of a word that looks similar." });
    }
  }

  function draw(){
    const r = rounds[cur];
    picker.value = cur;
    title.innerHTML = "Ronde " + (cur + 1) + " / " + rounds.length + " — " + esc(r.topic) +
      (r.level ? ' <span class="tag">' + esc(r.level) + "</span>" : "");
    prev.disabled = cur === 0;
    next.disabled = cur === rounds.length - 1;

    board.innerHTML = "";
    selectedChip = null;

    const rows = el("div", "rows");
    r.words.forEach(pair => {
      const key = r.topic + "::" + pair[1];
      const row = el("div", "mrow");
      row.appendChild(el("div", "w-en2", pair[0]));
      const slot = el("div", "slot");
      if(prog[key]){
        slot.textContent = pair[1];
        slot.classList.add("correct", "filled");
      } else {
        slot.textContent = "…";
        slot.addEventListener("dragover", e => { e.preventDefault(); slot.classList.add("dragover"); });
        slot.addEventListener("dragleave", () => slot.classList.remove("dragover"));
        slot.addEventListener("drop", e => {
          e.preventDefault();
          slot.classList.remove("dragover");
          const word = dragged ? dragged.word : e.dataTransfer.getData("text/plain");
          place(slot, key, pair[1], word, dragged ? dragged.chip : null);
          dragged = null;
        });
        slot.addEventListener("click", () => {
          if(selectedChip){
            place(slot, key, pair[1], selectedChip.dataset.word, selectedChip);
            selectedChip.classList.remove("sel");
            selectedChip = null;
          }
        });
      }
      row.appendChild(slot);
      rows.appendChild(row);
    });
    board.appendChild(rows);

    const bank = el("div", "bank");
    const remaining = r.words.filter(w => !prog[r.topic + "::" + w[1]]).map(w => w[1]);
    shuffle(remaining).forEach(word => {
      const chip = el("div", "chip", word);
      chip.draggable = true;
      chip.dataset.word = word;
      chip.addEventListener("dragstart", e => {
        dragged = { word: word, chip: chip };
        e.dataTransfer.setData("text/plain", word);
        e.dataTransfer.effectAllowed = "move";
      });
      chip.addEventListener("click", () => {
        if(chip.classList.contains("sel")){
          chip.classList.remove("sel");
          selectedChip = null;
        } else {
          bank.querySelectorAll(".chip.sel").forEach(c => c.classList.remove("sel"));
          chip.classList.add("sel");
          selectedChip = chip;
        }
      });
      bank.appendChild(chip);
    });
    board.appendChild(bank);

    const done = el("div", "donebar");
    if(remaining.length === 0) done.textContent = "🎉 Ronde voltooid!";
    board.appendChild(done);
  }

  draw();
}

/* =================== TYPE: order =================== */
function renderOrder(ctx){
  const { body, prog, save } = ctx;
  let lastGroup = null;
  ctx.m.data.forEach(item => {
    if(item.group && item.group !== lastGroup){
      lastGroup = item.group;
      body.appendChild(el("h2", "section", item.group));
    }
    body.appendChild(orderCard(item, prog, save));
  });
}
function orderCard(item, prog, save){
  const answers = toArr(item.nl);
  const key = answers[0];
  const tokens = answers[0].split(/\s+/);

  const card = el("div", "card");
  card.appendChild(el("div", "c-en", "🇬🇧 " + item.en));
  if(item.note) card.appendChild(el("div", "c-note", "💡 " + item.note));

  const target = el("div", "ordertarget");
  const bank = el("div", "orderbank");
  const hint = el("div", "orderhint", "");
  card.appendChild(target);
  card.appendChild(bank);
  card.appendChild(hint);

  function showSolved(){
    target.classList.add("done");
    target.innerHTML = "";
    tokens.forEach(t => target.appendChild(el("span", "otok fixed", t)));
    bank.innerHTML = "";
    hint.textContent = "✓ juist";
    hint.className = "orderhint good";
  }

  if(prog[key]){ showSolved(); return card; }

  let ids = shuffle(tokens.map((t, i) => i));
  if(tokens.length > 1 && ids.every((v, i) => v === i)) ids.reverse();
  const placed = [];

  function evaluate(){
    if(placed.length !== tokens.length){ hint.textContent = ""; hint.className = "orderhint"; return; }
    const attempt = placed.map(ti => tokens[ti]).join(" ");
    if(answers.indexOf(attempt) >= 0){
      prog[key] = true; save();
      showSolved();
    } else {
      hint.textContent = "✗ nog niet juist — tik een woord aan om aan te passen";
      hint.className = "orderhint bad";
      target.classList.add("shake");
      setTimeout(() => target.classList.remove("shake"), 400);
      bumpStruggle("ord:" + key, 2, { nl: "Woordvolgorde: in een gewone zin staat het werkwoord op de 2e plaats; in een vraag helemaal vooraan.", en: "Word order: in a normal sentence the verb is in second place; in a question it comes first." });
    }
  }
  function redraw(){
    target.innerHTML = "";
    bank.innerHTML = "";
    if(placed.length === 0){
      target.appendChild(el("span", "orderplaceholder", "tik de woorden hieronder in de juiste volgorde…"));
    }
    placed.forEach((ti, pos) => {
      const s = el("span", "otok", tokens[ti]);
      s.onclick = () => { placed.splice(pos, 1); hint.textContent = ""; hint.className = "orderhint"; redraw(); };
      target.appendChild(s);
    });
    ids.filter(ti => placed.indexOf(ti) < 0).forEach(ti => {
      const s = el("span", "otok bankchip", tokens[ti]);
      s.onclick = () => { placed.push(ti); redraw(); evaluate(); };
      bank.appendChild(s);
    });
  }
  redraw();
  return card;
}

function renderChoice(ctx){

    const key = item.q;
    const card = el("div", "card");
    card.appendChild(el("div", "q", item.q));
    const opts = el("div", "choiceopts");
    const locked = !!prog[key];

    let note = null;
    if(item.note){
      note = el("div", "c-note", "✓ " + item.note);
      note.hidden = !locked;
    }

    shuffle(item.options).forEach(opt => {
      const b = el("button", "choicebtn", opt);
      if(locked){
        b.disabled = true;
        if(opt === item.answer) b.classList.add("correct");
      }
      b.onclick = () => {
        if(opt === item.answer){
          b.classList.add("correct");
          opts.querySelectorAll("button").forEach(x => x.disabled = true);
          if(note) note.hidden = false;
          prog[key] = true; save();
        } else {
          b.classList.add("incorrect");
          setTimeout(() => b.classList.remove("incorrect"), 500);
          bumpStruggle("ch:" + key, 3, { nl: "Lees de zin nog eens rustig — welk woord hoort hier vast bij? Twijfel je tussen twee? Kies de meest gebruikte.", en: "Read the sentence again calmly — which word fixedly belongs here? Torn between two? Pick the more common one." });
        }
      };
      opts.appendChild(b);
    });
    card.appendChild(opts);
    if(note) card.appendChild(note);
    body.appendChild(card);
  });
}

    if(!prog[key]) mark.hidden = true;
    reveal.onclick = () => {
      const show = back.hidden;
      back.hidden = !show;
      if(note) note.hidden = !show;
      reveal.textContent = show ? "Verberg" : "Toon antwoord";
      mark.hidden = false;
    };
    mark.onclick = () => {
      prog[key] = !prog[key];
      if(!prog[key]) delete prog[key];
      save();
      card.classList.toggle("known", !!prog[key]);
      mark.textContent = prog[key] ? "✓ Gekend" : "Markeer als gekend";
    };
    actions.appendChild(reveal);
    actions.appendChild(mark);
    card.appendChild(actions);
    body.appendChild(card);
  });
}

function buildTypeWords(){
  const seen = {};
  function add(en, nl, group){
    en = String(en == null ? "" : en).trim();
    nl = String(nl == null ? "" : nl).trim();
    if(!en || !nl) return;
    const k = en.toLowerCase();
    if(!seen[k]) seen[k] = { en: en, nls: [], group: group };
    if(seen[k].nls.indexOf(nl) < 0) seen[k].nls.push(nl);
  }
  (typeof DATA_MATCH !== "undefined" ? DATA_MATCH : []).forEach(r => r.words.forEach(w => add(w[0], w[1], "Woordenschat — " + r.topic)));
  (typeof DATA_WOORDXL !== "undefined" ? DATA_WOORDXL : []).forEach(r => r.words.forEach(w => add(w[0], w[1], "Woordenschat XL — " + r.topic)));
  (typeof DATA_DEHET !== "undefined" ? DATA_DEHET : []).forEach(c => c.words.forEach(w => add(w[0], w[1], "Lidwoord-woorden — " + c.topic)));
  let list = Object.keys(seen).map(k => {
    const s = seen[k];
    return { en: s.en, nl: s.nls[0], alts: s.nls.slice(1), group: s.group };
  });
  if(list.length > 520){                       // gelijkmatig uitdunnen, alle thema's behouden
    const step = list.length / 500, out = [];
    for(let i = 0; i < list.length; i += step) out.push(list[Math.floor(i)]);
    list = out;
  }
  return list;
}
function buildTypeSent(){
  const out = [], seen = {};
  function add(nl, en, group){
    nl = String(nl == null ? "" : nl).trim();
    en = String(en == null ? "" : en).trim();
    if(!nl || !en) return;
    const k = nl.toLowerCase();
    if(seen[k]) return;
    seen[k] = 1;
    out.push({ en: en, nl: nl, group: group });
  }
  (typeof DATA_TYPESENT_EXTRA !== "undefined" ? DATA_TYPESENT_EXTRA : []).forEach(s => add(s.nl, s.en, s.group || "Dagelijkse zinnen"));
  (typeof DATA_ZINNEN !== "undefined" ? DATA_ZINNEN : []).forEach(z => add(Array.isArray(z.nl) ? z.nl[0] : z.nl, z.en, "Zinnen — " + (z.group || "").replace(/^\d+\s*·\s*/, "")));
  (typeof DATA_CONJUG !== "undefined" ? DATA_CONJUG : []).forEach(v => { if(v.ex && v.ex.length >= 2) add(v.ex[0], v.ex[1], "Voorbeeldzinnen met werkwoorden"); });
  return out;
}

/* ---- fuzzy nakijken ---- */
const NUM_NL = { 0:"nul",1:"een",2:"twee",3:"drie",4:"vier",5:"vijf",6:"zes",7:"zeven",8:"acht",9:"negen",
  10:"tien",11:"elf",12:"twaalf",13:"dertien",14:"veertien",15:"vijftien",16:"zestien",17:"zeventien",
  18:"achttien",19:"negentien",20:"twintig",21:"eenentwintig",22:"tweeentwintig",25:"vijfentwintig",
  30:"dertig",40:"veertig",50:"vijftig",60:"zestig",70:"zeventig",80:"tachtig",90:"negentig",
  100:"honderd",1000:"duizend" };
function normText(s){
  return String(s == null ? "" : s).toLowerCase()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")
    .replace(/[.,!?;:'"()’‘“”]/g, "")
    .replace(/(\d+)\s*(?:u|uur)\b/g, "$1 uur")
    .replace(/\b\d+\b/g, m => (NUM_NL[+m] != null ? NUM_NL[+m] : m))
    .replace(/\s+/g, " ").trim();
}
function lev(a, b){
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  const d = [];
  for(let j = 0; j <= n; j++) d[j] = j;
  for(let i = 1; i <= m; i++){
    let prev = d[0];
    d[0] = i;
    for(let j = 1; j <= n; j++){
      const tmp = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return d[n];
}
function fuzzyWordEq(x, w){ return x === w || lev(x, w) <= Math.max(1, Math.floor(w.length * 0.34)); }
function lcsWords(u, c){
  const m = u.length, n = c.length;
  const dp = [];
  for(let i = 0; i <= m; i++) dp.push(new Array(n + 1).fill(0));
  for(let i = 1; i <= m; i++){
    for(let j = 1; j <= n; j++){
      dp[i][j] = fuzzyWordEq(u[i - 1], c[j - 1]) ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
    }
  }
  return dp[m][n];
}
function simOne(u, a){
  u = normText(u); a = normText(a);
  if(!u) return 0;
  if(u === a) return 1;
  const cs = 1 - lev(u, a) / Math.max(u.length, a.length);
  const aw = a.split(" "), uw = u.split(" ");
  if(aw.length <= 1) return cs;               // enkel woord: teken-gelijkenis
  let matched = 0;
  const pool = uw.slice();
  aw.forEach(w => {
    let bi = -1, bd = 1e9;
    pool.forEach((x, i) => { const dd = lev(x, w); if(dd < bd){ bd = dd; bi = i; } });
    if(bi >= 0 && bd <= Math.max(1, Math.floor(w.length * 0.34))){ matched++; pool.splice(bi, 1); }
  });
  const ws = matched / aw.length;                       // juiste woorden (volgorde-blind)
  const os = lcsWords(uw, aw) / aw.length;              // juiste woorden in juiste volgorde
  const lenr = Math.min(uw.length, aw.length) / Math.max(uw.length, aw.length);
  const blend = cs * 0.34 + os * 0.46 + ws * 0.12 + lenr * 0.08;
  return cs >= 0.97 ? Math.max(cs, blend) : blend;
}
function stripArt(s){ return String(s).replace(/^\s*(de|het|een)\s+/i, ""); }
function gradeText(user, answers, wordMode){
  let best = 0;
  answers.forEach(a => {
    best = Math.max(best, simOne(user, a));
    if(wordMode){
      best = Math.max(best, simOne(stripArt(user), a));
      best = Math.max(best, simOne(user, stripArt(a)));
      best = Math.max(best, simOne(stripArt(user), stripArt(a)));
    }
  });
  return best;
}
function typeTip(user, correct, level){
  const u = normText(user).split(" ").filter(Boolean);
  const c = normText(correct).split(" ").filter(Boolean);
  if(c.length <= 1){
    const first = correct.trim()[0].toLowerCase(), n = correct.replace(/\s/g, "").length;
    return { nl: "Hint: het begint met “" + first + "” en heeft " + n + " letters.",
             en: "Hint: it starts with “" + first + "” and has " + n + " letters." };
  }
  for(let i = 0; i < c.length; i++){
    if(u[i] !== c[i]){
      if(u[i] && lev(u[i], c[i]) <= 2)
        return { nl: "Kijk goed naar “" + c[i] + "” — jij schreef “" + (u[i] || "…") + "”.",
                 en: "Look closely at “" + c[i] + "” — you wrote “" + (u[i] || "…") + "”." };
      return { nl: "Woord " + (i + 1) + " klopt niet: het moet “" + c[i] + "” zijn.",
               en: "Word " + (i + 1) + " is off: it should be “" + c[i] + "”." };
    }
  }
  if(u.length !== c.length)
    return { nl: "De zin heeft " + c.length + " woorden — jij hebt er " + u.length + ".",
             en: "The sentence has " + c.length + " words — you have " + u.length + "." };
  return { nl: "Bijna! Let op de woordvolgorde: het werkwoord staat op de tweede plaats.",
           en: "Almost! Mind the word order: the verb goes in second place." };
}

function typeCard(item, prog, save, wordMode){
  const answers = [item.nl].concat(item.alts || []);
  const key = item.nl;
  const card = el("div", "card");
  card.appendChild(el("div", "c-en", "🇬🇧 " + item.en));

  const row = el("div", "typerow");
  const inp = document.createElement("input");
  inp.type = "text";
  inp.className = "typeinput";
  inp.placeholder = wordMode ? "Nederlands woord…" : "Typ de Nederlandse zin…";
  inp.setAttribute("autocapitalize", "off");
  inp.setAttribute("autocorrect", "off");
  inp.setAttribute("autocomplete", "off");
  inp.spellcheck = false;
  const btn = el("button", "typebtn", "Nakijken");
  row.appendChild(inp);
  row.appendChild(btn);
  card.appendChild(row);
  const fb = el("div", "typefb");
  card.appendChild(fb);

  function lockGreen(silent){
    inp.disabled = true;
    btn.disabled = true;
    inp.classList.remove("yellow", "red");
    inp.classList.add("green");
    fb.className = "typefb green";
    fb.textContent = "✓ Juist — " + item.nl;
    if(!prog[key]){ prog[key] = true; save(); }
  }
  if(prog[key]){ inp.value = item.nl; lockGreen(true); return card; }

  let tries = 0, revealShown = false, idleTimer = null;
  function revealBtn(){
    if(revealShown) return;
    revealShown = true;
    const rb = el("button", "typebtn ghost", "Toon oplossing");
    rb.onclick = () => { inp.value = item.nl; lockGreen(); rb.remove(); };
    card.appendChild(rb);
  }
  function check(){
    if(!inp.value.trim()) return;
    tries++;
    const r = gradeText(inp.value, answers, wordMode);
    inp.classList.remove("green", "yellow", "red");
    if(r >= 0.9){ lockGreen(); return; }
    if(r >= 0.7){
      inp.classList.add("yellow");
      fb.className = "typefb yellow";
      fb.textContent = "≈ Bijna (" + Math.round(r * 100) + "%) — typfout of een ander woord. Probeer opnieuw.";
      if(tries >= 2){ revealBtn(); mascotStruggle(typeTip(inp.value, item.nl, "yellow")); }
    } else {
      inp.classList.add("red");
      fb.className = "typefb red";
      fb.textContent = "✗ Nog niet juist — probeer opnieuw.";
      if(tries >= 2) revealBtn();
      if(tries >= 3) mascotStruggle(typeTip(inp.value, item.nl, "red"));
    }
  }
  btn.onclick = check;
  inp.addEventListener("keydown", e => { if(e.key === "Enter") check(); });
  inp.addEventListener("focus", () => {
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if(!inp.disabled && !inp.value.trim()){
        const tp = typeTip("", item.nl, "red");
        mascotStruggle({ nl: "Twijfel je? " + tp.nl, en: "Not sure? " + tp.en });
      }
    }, 14000);
  });
  inp.addEventListener("blur", () => clearTimeout(idleTimer));
  return card;
}

/* ---------- spraak: voorlezen (TTS) ---------- */
var _voices = [], _nlVoice = null, _ttsOn = (lsGet(NS + "_tts", 1) !== 0);

/* ---------- geluidseffecten (Web Audio, geen bestanden) ---------- */
let _ac = null;
function audioCtx(){
  try {
    if(!_ac) _ac = new (window.AudioContext || window.webkitAudioContext)();
    if(_ac.state === "suspended") _ac.resume();
  } catch(e){ _ac = null; }
  return _ac;
}
function _tone(ctx, freq, at, dur, type, gain){
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type || "sine";
  o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0.0001, at);
  g.gain.linearRampToValueAtTime(gain || 0.18, at + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0005, at + dur);
  o.connect(g); g.connect(ctx.destination);
  o.start(at); o.stop(at + dur + 0.03);
}
function sfx(name){
  if(!_sfxOn) return;
  const ctx = audioCtx(); if(!ctx) return;
  const t = ctx.currentTime + 0.01;
  const seq = {
    correct: [[659, 0], [880, 0.08], [1175, 0.17]],
    combo:   [[784, 0], [988, 0.07], [1319, 0.14], [1760, 0.22]],
    crown:   [[1319, 0], [1760, 0.09], [2637, 0.18]],
    tap:     [[520, 0]],
    win:     [[523, 0], [659, 0.11], [784, 0.22], [1047, 0.35], [1319, 0.5], [1760, 0.66]]
  }[name];
  if(name === "wrong"){
    _tone(ctx, 233, t, 0.14, "sawtooth", 0.1);
    _tone(ctx, 175, t + 0.09, 0.2, "sine", 0.1);
    return;
  }
  if(!seq) return;
  const long = name === "win";
  seq.forEach(([f, d]) => _tone(ctx, f, t + d, long ? 0.42 : 0.22, "triangle", long ? 0.2 : 0.18));
}
