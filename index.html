/* Uitspraak-woordenboek: losse woorden die de stem anders verkeerd zegt.
   Alleen toegepast op losse woorden (niet in zinnen), zodat "een" als
   lidwoord in een zin gewoon /ən/ blijft. Vul gerust aan. */
const PRON = {
  "een": "één",
  "gsm": "gee-es-em", "sms": "es-em-es", "tv": "tee-vee", "pc": "pee-cee",
  "cd": "cee-dee", "dvd": "dee-vee-dee", "wc": "wee-cee", "eu": "ee-joe",
  "'s morgens": "s ochtends"
};
function fixPron(text, isWord){
  let t = String(text).replace(/\s*\/\s*.*$/, "").replace(/\(.*?\)/g, "").trim() || String(text);
  if(isWord){
    const key = t.toLowerCase().replace(/[.!?,;:"']/g, "").trim();
    if(PRON[key]) return PRON[key];
  }
  // altijd veilig (informele samentrekkingen die de stem struikelt over)
  t = t.replace(/\bz'n\b/gi, "zijn").replace(/\bm'n\b/gi, "mijn").replace(/\bd'r\b/gi, "der")
       .replace(/(^|\s)'t(\s|$)/gi, "$1het$2");
  return t;
}
function speak(text, opts){
  opts = opts || {};
  if(!window.speechSynthesis || !_ttsOn) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(fixPron(text, opts.word));
    u.lang = "nl-BE";
    if(_nlVoice) u.voice = _nlVoice;
    u.rate = opts.slow ? 0.62 : 0.92;
    u.pitch = 1.02;
    speechSynthesis.speak(u);
  } catch(e){}
}
function spk(text, extra){
  const b = el("button", "spk" + (extra ? " " + extra : ""));
  b.type = "button";
  b.innerHTML = '<svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.06A7 7 0 0 1 14 20.7v2.06A9 9 0 0 0 14 3.2z"/></svg>';
  b.setAttribute("aria-label", "Uitspreken");
  b.onclick = e => { e.stopPropagation(); e.preventDefault(); speak(text, { word: true }); };
  return b;
}

/* ---------- spraak: herkennen (mic) ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
function recognizeNL(onResult, onErr){
  if(!SR){ onErr && onErr("unsupported"); return null; }
  let r;
  try { r = new SR(); } catch(e){ onErr && onErr("unsupported"); return null; }
  r.lang = "nl-BE";
  r.interimResults = false;
  r.maxAlternatives = 4;
  r.onresult = e => {
    const alts = [];
    for(let i = 0; i < e.results[0].length; i++) alts.push(e.results[0][i].transcript);
    onResult(alts);
  };
  r.onerror = e => onErr && onErr(e.error || "error");
  try { r.start(); } catch(e){ onErr && onErr("error"); }
  return r;
}

const UNIT_COLORS = ["#58cc02","#1cb0f6","#ce82ff","#ff86d0","#ff9600","#ffc800","#2ec4b6","#ff5b7f","#a56cff","#00c2a8"];
const UNIT_ICONS  = ["🌱","💬","👨‍👩‍👧","⏰","🧍","👕","🍞","🏠","🐶","🌅","☀️","🚲","🛒","🏫","🗣️","🏃","🍽️","🩺","🚉","😊","💼","🧠","🇧🇪","🌍","🎯","⭐","🔥","🏆","🚀","💎"];

let _course = null;
function getCourse(){ return _course || (_course = buildCourse()); }

function buildCourse(){
  const rank = { makkelijk: 0, middel: 1, moeilijk: 2 };
  const seen = new Map();
  function addWord(en, nl, lvl, theme){
    en = String(en || "").trim(); nl = String(nl || "").trim();
    const k = en.toLowerCase();
    if(!k || !nl) return;
    if(!seen.has(k)) seen.set(k, { en: en, nls: [nl], lvl: (rank[lvl] != null ? rank[lvl] : 1), theme: theme || "", kind: "word" });
    else { const o = seen.get(k); if(o.nls.indexOf(nl) < 0) o.nls.push(nl); }
  }
  (typeof DATA_MATCH !== "undefined" ? DATA_MATCH : []).forEach(r => r.words.forEach(w => addWord(w[0], w[1], r.level, r.topic)));
  (typeof DATA_WOORDXL !== "undefined" ? DATA_WOORDXL : []).forEach(r => r.words.forEach(w => addWord(w[0], w[1], r.level, r.topic)));
  (typeof DATA_DEHET !== "undefined" ? DATA_DEHET : []).forEach(c => c.words.forEach(w => addWord(w[0], w[1], "middel", c.topic)));

  const words = [...seen.values()];
  words.forEach((w, i) => w._ord = i);
  words.sort((a, b) => (a.lvl - b.lvl) || (a._ord - b._ord));   // stabiel: makkelijk -> moeilijk

  const sSeen = new Set(), sents = [];
  function addSent(en, nl, lvl){
    en = String(en || "").trim(); nl = String(nl || "").trim();
    const k = nl.toLowerCase();
    if(!en || !nl || sSeen.has(k) || nl.split(/\s+/).length < 2 || nl.split(/\s+/).length > 11) return;
    sSeen.add(k); sents.push({ en: en, nl: nl, lvl: lvl, kind: "sentence" });
  }
  (typeof DATA_ZINNEN !== "undefined" ? DATA_ZINNEN : []).forEach(z => addSent(z.en, toArr(z.nl)[0], 0));
  (typeof DATA_CONJUG !== "undefined" ? DATA_CONJUG : []).forEach(v => { if(v.ex && v.ex.length >= 2) addSent(v.ex[1], v.ex[0], 1); });

  const lessons = [];
  let wi = 0, si = 0, introduced = [];
  const TARGET = 300, HARDCAP = 344;
  let L = 0;
  while(lessons.length < TARGET || wi < words.length){
    if(lessons.length >= HARDCAP) break;
    const newPer = L < 36 ? 3 : (L < 150 ? 4 : 5);
    const isReview = (L % 5 === 4);
    const isSent = (L >= 14 && !isReview && (L % 7 === 3) && si < sents.length);

    if(isSent){
      const chunk = sents.slice(si, si + 5);
      si += chunk.length;
      lessons.push({ id: "L" + L, u: (L / 5) | 0, kind: "sentences", sents: chunk, teach: [], recycle: [] });
    } else if(isReview || wi >= words.length){
      const recent = introduced.slice(-14);
      const older = introduced.length > 14 ? duoShuffle(introduced.slice(0, -14)).slice(0, 6) : [];
      lessons.push({ id: "L" + L, u: (L / 5) | 0, kind: "review", teach: [], recycle: recent.concat(older) });
    } else {
      const teach = words.slice(wi, wi + newPer);
      wi += teach.length;
      const recycle = introduced.slice(-Math.min(8, introduced.length));
      introduced = introduced.concat(teach);
      lessons.push({ id: "L" + L, u: (L / 5) | 0, kind: "learn", teach: teach, recycle: recycle });
    }
    L++;
  }

  // eenheden
  const units = [];
  lessons.forEach(ls => {
    if(!units[ls.u]){
      const themeGuess = (ls.teach && ls.teach[0] && ls.teach[0].theme) ||
        (lessons.find(x => x.u === ls.u && x.teach && x.teach[0]) || {}).teach || "";
      units[ls.u] = {
        idx: ls.u,
        color: UNIT_COLORS[ls.u % UNIT_COLORS.length],
        icon: UNIT_ICONS[ls.u % UNIT_ICONS.length],
        title: "",
        lessons: []
      };
    }
    units[ls.u].lessons.push(ls);
  });
  units.forEach(u => {
    const cnt = {};
    u.lessons.forEach(ls => (ls.teach || []).forEach(it => { if(it.theme) cnt[it.theme] = (cnt[it.theme] || 0) + 1; }));
    let best = "", bn = 0;
    Object.keys(cnt).forEach(t => { if(cnt[t] > bn){ bn = cnt[t]; best = t; } });
    u.title = best || (u.lessons.some(l => l.kind === "sentences") ? "Zinnen oefenen" : "Herhalen & mix");
  });

  const flat = lessons.slice();
  return { units: units, flat: flat, words: words, sents: sents };
}

/* ============ OEFENINGEN VOOR ÉÉN LES ============ */
function pickDistract(correct, field, n, exclude){
  const all = getCourse().words;
  const bad = new Set((exclude || []).map(s => String(s).toLowerCase()));
  (field === "nls" ? correct.nls : [correct.en]).forEach(s => bad.add(String(s).toLowerCase()));
  const out = [];
  const pool = duoShuffle(all);
  for(let i = 0; i < pool.length && out.length < n; i++){
    const cand = field === "nls" ? pool[i].nls[0] : pool[i].en;
    const key = String(cand).toLowerCase();
    if(bad.has(key)) continue;
    bad.add(key); out.push(cand);
  }
  return out;
}
function exPick(it, back){                 // EN -> kies NL   (of NL -> kies EN als back)
  const prompt = back ? it.nls[0] : it.en;
  const answer = back ? it.en : it.nls[0];
  const opts = duoShuffle([answer].concat(pickDistract(it, back ? "en" : "nls", 3)));
  return { t: "pick", prompt: prompt, promptSpeak: back ? it.nls[0] : null, answer: answer, opts: opts, speakOpts: !back, it: it };
}
function exListen(it){                      // hoor NL -> kies NL
  const answer = it.nls[0];
  const opts = duoShuffle([answer].concat(pickDistract(it, "nls", 3)));
  return { t: "listen", play: answer, answer: answer, opts: opts, hintEN: it.en, it: it };
}
function exType(it){                        // EN -> typ NL
  return { t: "type", prompt: it.en, answer: it.nls, it: it };
}
function exTypeListen(s){                   // hoor NL-zin -> typ ze
  return { t: "typeListen", play: s.nl, answer: [s.nl], hintEN: s.en, it: s };
}
function exBuild(s, listen){               // zet woorden in juiste volgorde (evt. na gehoord te hebben)
  return { t: "build", play: listen ? s.nl : null, listen: !!listen, answer: s.nl, hintEN: s.en, it: s };
}
function exMatch(items){
  return { t: "match", pairs: items.slice(0, 5).map(it => [it.en, it.nls[0]]) };
}
function exSpeak(it){
  const target = it.kind === "sentence" ? it.nl : it.nls[0];
  return { t: "speak", target: target, word: it.kind !== "sentence", hintEN: it.en, it: it };
}
function quizPool(){
  return [].concat(
    (typeof DATA_VOORZETSELS !== "undefined" ? DATA_VOORZETSELS : []),
    (typeof DATA_UITDRUKKINGEN !== "undefined" ? DATA_UITDRUKKINGEN : [])
  );
}
function exQuiz(){                          // vraag met A / B / C / D
  const p = quizPool();
  if(!p.length) return null;
  const item = p[(Math.random() * p.length) | 0];
  let opts = duoShuffle(item.options.slice()).slice(0, 4);
  if(opts.indexOf(item.answer) < 0){ opts[3] = item.answer; opts = duoShuffle(opts); }
  return { t: "quiz", q: item.q, answer: item.answer, opts: opts, it: { en: item.q, nls: [item.answer] } };
}

function buildLesson(lesson, unitIdx){
  const hard = unitIdx >= 8;
  const exs = [];
  if(lesson.kind === "sentences"){
    lesson.sents.forEach((s, i) => {
      exs.push(exBuild(s, i % 2 === 1));
      exs.push(i % 2 === 0 ? exTypeListen(s) : exType(s));
    });
    if(SR && _micOn && lesson.sents.length) exs.splice(Math.min(exs.length, 6), 0, exSpeak(lesson.sents[0]));
  } else {
    const pool = [];
    const seen = new Set();
    (lesson.teach || []).concat(lesson.recycle || []).forEach(it => {
      const k = it.en.toLowerCase();
      if(!seen.has(k)){ seen.add(k); pool.push(it); }
    });
    if(!pool.length) return [];

    if(lesson.kind === "learn"){
      (lesson.teach || []).forEach((it, i) => exs.push(i % 2 === 0 ? exPick(it, false) : exListen(it)));
      (lesson.teach || []).forEach((it, i) => { if(i < 2) exs.push(exPick(it, true)); });
    }
    let i = 0;
    const wantQuiz = (lesson.kind === "review" || unitIdx >= 5) && Math.random() < 0.5;
    while(exs.length < 10){
      const it = pool[(i * 3 + 2) % pool.length];
      const roll = (i + (hard ? 2 : 0)) % 7;
      if(wantQuiz && i === 3){ const q = exQuiz(); if(q){ exs.push(q); i++; continue; } }
      if(roll === 0) exs.push(exPick(it, false));
      else if(roll === 1) exs.push(exListen(it));
      else if(roll === 2) exs.push(exPick(it, true));
      else if(roll === 3) exs.push(exType(it));
      else if(roll === 4 && pool.length >= 5) exs.push(exMatch(duoShuffle(pool)));
      else if(roll === 5) exs.push(exType(it));
      else exs.push(exListen(it));
      i++;
    }
    if(SR && _micOn) exs.splice(Math.max(0, exs.length - 2), 0, exSpeak(pool[0]));
  }
  return duoShuffleKeepFirst(exs).slice(0, 10);
}
function duoShuffleKeepFirst(arr){
  if(arr.length <= 2) return arr;
  const head = arr.slice(0, 1);
  return head.concat(duoShuffle(arr.slice(1)));
}

let _lx = null, _justFinished = null;
function startLesson(lessonId){
  const course = getCourse();
  const lesson = course.flat.find(l => l.id === lessonId);
  if(!lesson){ location.hash = "#/"; return; }
  const cur = getCurrent();
  const exs = buildLesson(lesson, lesson.u);
  if(!exs.length){ location.hash = "#/"; return; }
  _lx = { lesson: lesson, queue: exs, pos: 0, again: [], right: 0, total: exs.length, xp: 0, combo: 0 };
  drawExercise();
}

function lxClose(){
  if(confirm("Les stoppen? Je voortgang van deze les gaat verloren.")){ _lx = null; location.hash = "#/"; }
}
function drawExercise(){
  const S = _lx;
  if(!S){ location.hash = "#/"; return; }
  if(S.pos >= S.queue.length){
    if(S.again.length){ S.queue = S.again; S.again = []; S.pos = 0; }
    else return finishLesson();
  }
  const ex = S.queue[S.pos];
  const done = S.total - S.queue.length + S.pos + (S.queue === S.again ? 0 : 0);
  const pct = Math.round(100 * (S.pos) / Math.max(1, S.queue.length));

  app.innerHTML = "";
  const wrap = el("div", "lx");
  const top = el("div", "lx-top");
  const x = el("button", "lx-x", "✕"); x.onclick = lxClose;
  const bar = el("div", "lx-bar"); const fill = el("div", "lx-fill"); fill.style.width = pct + "%"; bar.appendChild(fill);
  top.appendChild(x); top.appendChild(bar);
  wrap.appendChild(top);

  const body = el("div", "lx-body");
  wrap.appendChild(body);

  const foot = el("div", "lx-foot");
  const banner = el("div", "lx-banner");
  const act = el("button", "d-btn big", "Controleren");
  act.disabled = true;
  foot.appendChild(banner);
  foot.appendChild(act);
  wrap.appendChild(foot);
  app.appendChild(wrap);

  const ctx = {
    ex: ex, body: body, act: act, banner: banner,
    setReady: (ok) => { if(ctx.phase !== "answered") act.disabled = !ok; },
    phase: null            // null -> "retry" (bijna, opnieuw) -> "answered"
  };
  const R = EX_RENDER[ex.t] || EX_RENDER.pick;
  R(ctx);

  act.onclick = () => {
    if(ctx.phase === "answered"){ S.pos++; drawExercise(); return; }
    if(ctx.phase === "retry"){ drawExercise(); return; }   // zelfde oefening, vers

    const r = ctx.check();
    showBanner(banner, r);
    act.classList.remove("ok", "wrong", "retry");

    if(r.ok && !r.almost){
      ctx.phase = "answered";
      S.right++; S.xp += 8;
      S.combo = (S.combo || 0) + 1;
      recordWeak(ex, true);
      rewardCorrect(act, S.combo);
      act.textContent = "Doorgaan"; act.classList.add("ok");
      if(ctx.lock) ctx.lock();
    } else if(r.almost){
      ctx.phase = "retry";
      S.combo = 0;
      recordWeak(ex, false);
      sfx("wrong"); buzz(10);
      act.textContent = "Opnieuw proberen"; act.classList.add("retry");
      // niet vergrendelen: laat verbeteren tot het helemaal juist is
    } else {
      ctx.phase = "answered";
      S.combo = 0;
      S.again.push(ex);
      recordWeak(ex, false);
      sfx("wrong"); buzz([8, 40, 8]);
      act.textContent = "Doorgaan"; act.classList.add("wrong");
      if(ctx.lock) ctx.lock();
    }
  };
  window.scrollTo(0, 0);
}
function showBanner(b, r){
  b.className = "lx-banner show " + (r.ok && !r.almost ? "ok" : (r.almost ? "almost" : "bad"));
  b.innerHTML = (r.ok && !r.almost)
    ? "Goed zo! 🎉"
    : (r.almost
        ? "Bijna! Maak het helemaal juist om verder te gaan.<span>" + esc(r.solution || "") + "</span>"
        : "Antwoord: <span>" + esc(r.solution || "") + "</span>");
}
function recordWeak(ex, ok){
  const S = _lx; if(!S) return;
  const it = ex.it; if(!it) return;
  const key = (it.en || it.nl || "").toLowerCase();
  if(!key) return;
  const w = pathState(getCurrent()).weak;
  const e = w[key] || (w[key] = { w: 0, c: 0 });
  if(ok) e.c++; else e.w++;
  e.t = Date.now();
  e.en = it.en || ""; e.nl = it.nls ? it.nls[0] : (it.nl || "");
}
function finishLesson(){
  const S = _lx; const cur = getCurrent();
  const st = pathState(cur);
  const isReview = S.lesson.kind === "review";
  const gained = (isReview ? 20 : 15) + S.right * 2;
  st.xp += gained;
  const prev = st.crowns[S.lesson.id] || 0;
  const nowC = Math.min(3, prev + 1);
  st.crowns[S.lesson.id] = nowC;
  st.done = Object.keys(st.crowns).length;
  const t = todayStr();
  let streakUp = false;
  if(st.lastDay !== t){ st.streak = (st.lastDay === yesterStr()) ? (st.streak || 0) + 1 : 1; st.lastDay = t; streakUp = true; }
  savePath(cur);

  _justFinished = S.lesson.id;
  const perfect = S.right >= S.total;
  const milestone = [3, 7, 14, 30, 50, 75, 100, 150, 200, 365].indexOf(st.streak) >= 0;

  app.innerHTML = "";
  const w = el("div", "lx-end");
  const em = el("div", "lx-end-emoji pop", nowC > prev ? "🏆" : "🎉");
  w.appendChild(em);
  w.appendChild(el("h1", null, perfect ? "PERFECTE LES! 🌟" : "Les voltooid!"));
  const stats = el("div", "lx-stats");
  const xpTile = statTile("💎 XP", "+0", "#eab000");
  stats.appendChild(xpTile);
  stats.appendChild(statTile("🎯 Juist", S.right + "/" + S.total, "#3fa826"));
  stats.appendChild(statTile("🔥 Streak", (st.streak || 1) + (st.streak === 1 ? " dag" : " dagen"), "#ff8c00"));
  w.appendChild(stats);

  if(nowC > prev){
    const cr = el("div", "lx-crowns");
    for(let i = 0; i < nowC; i++){
      const c = el("span", "cr" + (i < prev ? " old" : ""), "👑");
      c.style.animationDelay = (0.15 + i * 0.28) + "s";
      cr.appendChild(c);
    }
    w.appendChild(cr);
    w.appendChild(el("div", "lx-crowns-l", "Niveau " + nowC + " / 3"));
  }
  if(milestone) w.appendChild(el("div", "lx-ribbon", "🔥 " + st.streak + " DAGEN OP RIJ!"));

  const go = el("button", "d-btn big", "Doorgaan");
  go.onclick = () => { _lx = null; location.hash = "#/"; };
  w.appendChild(go);
  app.appendChild(w);

  // beloningen
  sfx("win");
  buzz([12, 30, 12, 30, 24]);
  confetti();
  setTimeout(() => sparks(window.innerWidth / 2, window.innerHeight * 0.34, 26), 120);
  rewardPop(perfect ? "PERFECT! 🏆" : "LES KLAAR! 🎉", true);
  // XP telt op
  let shown = 0;
  const step = Math.max(1, Math.round(gained / 22));
  const tick = setInterval(() => {
    shown = Math.min(gained, shown + step);
    const v = xpTile.querySelector(".lx-stat-v");
    if(v) v.textContent = "+" + shown;
    if(shown >= gained) clearInterval(tick);
  }, 34);
  // kroontjes-geluid per kroon
  if(nowC > prev){
    for(let i = prev; i < nowC; i++) setTimeout(() => sfx("crown"), 200 + (i - prev) * 300 + (i) * 0);
  }
  if(milestone) setTimeout(() => sparks(window.innerWidth / 2, window.innerHeight * 0.5, 22, ["#ff8c00", "#ffc800", "#ff5b7f"]), 400);

  const msgs = [
    { nl: "Knap gedaan! 🎉 Op naar de volgende les!", en: "Well done! 🎉 On to the next lesson!" },
    { nl: "Woef! Dat ging goed! 🐾", en: "Woof! That went well! 🐾" },
    { nl: "Elke les maakt je sterker. Doe zo voort!", en: "Every lesson makes you stronger. Keep going!" }
  ];
  mascotSay(milestone
    ? { nl: "🔥 " + st.streak + " dagen op rij!! Zo trots op je!", en: "🔥 " + st.streak + " days in a row!! So proud of you!" }
    : (perfect
        ? { nl: "Foutloos! Jij bent op dreef! 💪", en: "Flawless! You're on fire! 💪" }
        : msgs[(Math.random() * msgs.length) | 0]), { celebrate: true, duration: 9000 });
}
function statTile(label, val, col){
  const t = el("div", "lx-stat");
  t.style.setProperty("--c", col);
  t.appendChild(el("div", "lx-stat-l", label));
  t.appendChild(el("div", "lx-stat-v", val));
  return t;
}

/* ---------- exercise renderers ---------- */
const EX_RENDER = {};

EX_RENDER.pick = function(ctx){
  const ex = ctx.ex;
  ctx.body.appendChild(el("div", "lx-q", ex.t === "pick" && ex.speakOpts ? "Kies de vertaling" : "Wat betekent dit?"));
  const p = el("div", "lx-prompt");
  p.appendChild(el("span", "lx-prompt-t", ex.prompt));
  if(ex.promptSpeak) p.appendChild(spk(ex.promptSpeak, "inline"));
  ctx.body.appendChild(p);
  let chosen = null;
  const grid = el("div", "lx-opts");
  ex.opts.forEach(o => {
    const b = el("button", "lx-opt");
    b.appendChild(el("span", null, o));
    if(ex.speakOpts) b.appendChild(spk(o, "mini"));
    b.onclick = () => {
      if(ctx.phase === "answered") return;
      grid.querySelectorAll(".lx-opt").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel"); chosen = o; ctx.setReady(true);
      if(ex.speakOpts) speak(o, { word: true });
    };
    grid.appendChild(b);
  });
  ctx.body.appendChild(grid);
  ctx.check = () => {
    const ok = norm(chosen) === norm(ex.answer);
    grid.querySelectorAll(".lx-opt").forEach(b => {
      const t = b.querySelector("span").textContent;
      if(norm(t) === norm(ex.answer)) b.classList.add("good");
      else if(t === chosen) b.classList.add("bad");
    });
    return { ok: ok, solution: ex.answer };
  };
  function norm(s){ return String(s || "").toLowerCase().trim(); }
};

      if(low(t) === low(ex.answer)) b.classList.add("good");
      else if(t === chosen) b.classList.add("bad");
    });
    return { ok: ok, solution: ex.answer + "  ·  " + ex.hintEN };
  };
  function low(s){ return String(s || "").toLowerCase().trim(); }
};

EX_RENDER.build = function(ctx){
  const ex = ctx.ex;
  ctx.body.appendChild(el("div", "lx-q", ex.listen ? "Tik de woorden in de volgorde die je hoort" : "Bouw de zin"));
  if(ex.listen){
    const big = el("button", "lx-bigspk");
    big.innerHTML = '<svg viewBox="0 0 24 24" width="30" height="30"><path fill="currentColor" d="M4 9v6h4l5 5V4L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>';
    big.onclick = () => speak(ex.play);
    ctx.body.appendChild(big);
    setTimeout(() => speak(ex.play), 350);
  } else {
    const p = el("div", "lx-prompt sm"); p.appendChild(el("span", null, "🇬🇧 " + ex.hintEN));
    ctx.body.appendChild(p);
  }
  const tokens = ex.answer.split(/\s+/);
  const target = el("div", "lx-build-target");
  const bank = el("div", "lx-build-bank");
  ctx.body.appendChild(target);
  ctx.body.appendChild(bank);
  if(ex.listen) ctx.body.appendChild(el("div", "lx-hint", "💡 " + ex.hintEN));

  let ids = duoShuffle(tokens.map((t, i) => i));
  if(tokens.length > 1 && ids.every((v, i) => v === i)) ids.reverse();
  const placed = [];
  function redraw(){
    target.innerHTML = ""; bank.innerHTML = "";
    if(!placed.length) target.appendChild(el("span", "lx-ph", "…"));
    placed.forEach((ti, pos) => {
      const s = el("button", "lx-tok", tokens[ti]);
      s.onclick = () => { if(ctx.phase === "answered") return; placed.splice(pos, 1); redraw(); };
      target.appendChild(s);
    });
    ids.filter(ti => placed.indexOf(ti) < 0).forEach(ti => {
      const s = el("button", "lx-tok bank", tokens[ti]);
      s.onclick = () => { if(ctx.phase === "answered") return; placed.push(ti); speak(tokens[ti]); redraw(); ctx.setReady(placed.length === tokens.length); };
      bank.appendChild(s);
    });
    ctx.setReady(placed.length === tokens.length);
  }
  redraw();
  ctx.lock = () => target.querySelectorAll(".lx-tok").forEach(b => b.disabled = true);
  ctx.check = () => {
    const got = placed.map(ti => tokens[ti]).join(" ");
    const ok = norm(got) === norm(ex.answer);
    return { ok: ok, solution: ex.answer };
  };
  function norm(s){ return String(s).toLowerCase().replace(/[.,!?]/g, "").replace(/\s+/g, " ").trim(); }
};
EX_RENDER.buildListen = EX_RENDER.build;

EX_RENDER.match = function(ctx){
  const ex = ctx.ex;
  ctx.body.appendChild(el("div", "lx-q", "Verbind de paren"));
  const grid = el("div", "lx-match");
  const left = el("div", "lx-match-col");
  const right = el("div", "lx-match-col");
  grid.appendChild(left); grid.appendChild(right);
  ctx.body.appendChild(grid);
  const L = ex.pairs.map((p, i) => ({ txt: p[0], i: i }));
  const Rr = duoShuffle(ex.pairs.map((p, i) => ({ txt: p[1], i: i })));
  let selL = null, selR = null, matched = 0;
  function mkBtn(o, side){
    const b = el("button", "lx-opt m");
    b.appendChild(el("span", null, o.txt));
    if(side === "R") b.appendChild(spk(o.txt, "mini"));
    b.dataset.i = o.i;
    b.onclick = () => {
      if(ctx.phase === "answered" || b.classList.contains("done")) return;
      (side === "L" ? left : right).querySelectorAll(".lx-opt").forEach(x => x.classList.remove("sel"));
      b.classList.add("sel");
      if(side === "L") selL = b; else { selR = b; speak(o.txt, { word: true }); }
      if(selL && selR){
        if(selL.dataset.i === selR.dataset.i){
          selL.classList.add("done"); selR.classList.add("done");
          selL.classList.remove("sel"); selR.classList.remove("sel");
          matched++; selL = null; selR = null;
          sfx("tap");
          if(matched === ex.pairs.length){ ctx.setReady(true); }
        } else {
          const a = selL, c = selR;
          a.classList.add("bad"); c.classList.add("bad");
          setTimeout(() => { a.classList.remove("bad", "sel"); c.classList.remove("bad", "sel"); }, 450);
          selL = null; selR = null;
        }
      }
    };
    return b;
  }
  L.forEach(o => left.appendChild(mkBtn(o, "L")));
  Rr.forEach(o => right.appendChild(mkBtn(o, "R")));
  ctx.check = () => ({ ok: matched === ex.pairs.length, solution: "" });
};

EX_RENDER.speak = function(ctx){
  const ex = ctx.ex;
  ctx.body.appendChild(el("div", "lx-q", "Spreek de zin uit"));
  const p = el("div", "lx-prompt sm");
  p.appendChild(el("span", "lx-prompt-t", ex.target));
  p.appendChild(spk(ex.target, "inline"));
  ctx.body.appendChild(p);
  ctx.body.appendChild(el("div", "lx-hint", "💡 " + (ex.hintEN || "")));
  const mic = el("button", "lx-mic", SR ? "🎤  Tik en spreek" : "🎤  Zeg het hardop");
  const out = el("div", "lx-heard", "");
  ctx.body.appendChild(mic);
  ctx.body.appendChild(out);
  const skip = el("button", "lx-slow", "Ik heb het gezegd — overslaan →");
  ctx.body.appendChild(skip);
  let score = 0, tried = false;
  skip.onclick = () => { score = 0.85; tried = true; ctx.setReady(true); out.textContent = "Top — zelf beoordeeld ✅"; out.className = "lx-heard ok"; };

  if(!SR){
    mic.onclick = () => { speak(ex.target, { word: ex.word }); score = 0.9; tried = true; ctx.setReady(true); out.textContent = "Zeg het luidop en tik dan hierboven."; };
  } else {
    mic.onclick = () => {
      if(ctx.phase === "answered") return;
      mic.classList.add("rec"); mic.textContent = "🎙️ Luisteren…";
      recognizeNL(alts => {
        mic.classList.remove("rec"); mic.textContent = "🎤 Opnieuw proberen";
        tried = true;
        let best = 0, bestT = alts[0] || "";
        alts.forEach(a => { const s = simOne(a, ex.target); if(s > best){ best = s; bestT = a; } });
        score = best;
        out.textContent = "Je zei: “" + bestT + "”  ·  " + Math.round(best * 100) + "%";
        out.className = "lx-heard " + (best >= 0.6 ? "ok" : "bad");
        ctx.setReady(true);
      }, err => {
        mic.classList.remove("rec");
        mic.textContent = err === "not-allowed" ? "🎤 Microfoon geweigerd" : "🎤 Opnieuw proberen";
        out.textContent = err === "not-allowed"
          ? "Geen microfoon-toegang — tik op “overslaan” of zet de mic aan in je browser."
          : "Niet goed verstaan — probeer opnieuw of sla over.";
      });
    };
  }
  ctx.check = () => ({ ok: tried && score >= 0.55, almost: tried && score >= 0.55 && score < 0.8, solution: ex.target });
};

function startReviewSession(weak){
  const items = weak.map(x => ({ en: x.en, nls: [x.nl], kind: "word", theme: "" })).filter(x => x.en && x.nls[0]);
  if(items.length < 4){ alert("Te weinig woorden."); return; }
  const exs = [];
  let i = 0;
  while(exs.length < 10){
    const it = items[i % items.length];
    const roll = i % 5;
    if(roll === 0) exs.push(exPick(it, false));
    else if(roll === 1) exs.push(exListen(it));
    else if(roll === 2) exs.push(exType(it));
    else if(roll === 3 && items.length >= 5) exs.push(exMatch(duoShuffle(items)));
    else exs.push(exPick(it, true));
    i++;
  }
  _lx = { lesson: { id: "REVIEW", kind: "review" }, queue: exs.slice(0, 10), pos: 0, again: [], right: 0, total: 10, xp: 0, combo: 0 };
  drawExercise();
}

let _sceneEl = null, _flyT = null, _hopT = null;
function ensureScene(){
  if(_sceneEl && document.body.contains(_sceneEl)) return;
  const s = document.createElement("div");
  s.id = "scene";
  s.innerHTML =
    '<div class="sky"></div><div class="sun"></div>' +
    '<div class="cloud" style="top:9%;animation-duration:62s"></div>' +
    '<div class="cloud" style="top:22%;animation-duration:95s;transform:scale(.78)"></div>' +
    '<div class="cloud" style="top:38%;animation-duration:80s;transform:scale(1.2)"></div>' +
    '<div class="ground"></div>';
  document.body.insertBefore(s, document.body.firstChild);
  _sceneEl = s;
  clearTimeout(_flyT); clearTimeout(_hopT);
  const fly = () => {
    if(!_sceneEl) return;
    try {
      const ws = getCourse().words;
      const w = ws[(Math.random() * ws.length) | 0];
      const sp = el("span", "flyword", Math.random() < 0.5 ? w.nls[0] : w.en);
      sp.style.top = (10 + Math.random() * 58) + "%";
      sp.style.animationDuration = (16 + Math.random() * 12) + "s";
      _sceneEl.appendChild(sp);
      setTimeout(() => sp.remove(), 30000);
    } catch(e){}
    _flyT = setTimeout(fly, 5500 + Math.random() * 6000);
  };
  const crit = ["🐰", "🐿️", "🐤", "🦔", "🐸", "🦆"];
  const hop = () => {
    if(!_sceneEl) return;
    const h = el("div", "hopper");
    const inner = el("span", null, crit[(Math.random() * crit.length) | 0]);
    h.appendChild(inner);
    h.style.animationDuration = (9 + Math.random() * 7) + "s";
    _sceneEl.appendChild(h);
    setTimeout(() => h.remove(), 17000);
    _hopT = setTimeout(hop, 12000 + Math.random() * 12000);
  };
  _flyT = setTimeout(fly, 1600);
  _hopT = setTimeout(hop, 4500);
}

  app.innerHTML = '<div class="gate"><div class="gate-logo">🇧🇪</div>' +
    '<h1>Nederlands leren</h1><p class="dim">laden…</p></div>';
  try { await storeInit(); } catch(e){ console.warn(e); }
  if(!location.hash) location.hash = "#/";
  route();
})();

</script>
